<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 대시보드 · 마이 헬스 로그</title>
<style>
  :root{
    --bg:#eef2f5; --card:#ffffff; --ink:#16232e; --muted:#64748b;
    --line:#e2e8f0; --field:#f8fafc;
    --brand:#0f766e; --brand-ink:#0b5a54; --brand-soft:#d5ece9;
    --ok:#15803d; --ok-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdeaea;
    --warn:#b45309; --warn-bg:#fdf2e3; --info:#1d4ed8; --info-bg:#e6edfd;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Consolas",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    --radius:14px; --shadow:0 1px 2px rgba(16,35,46,.06),0 8px 24px rgba(16,35,46,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1317; --card:#161d23; --ink:#e6edf3; --muted:#8b98a5;
      --line:#26303a; --field:#0f161b;
      --brand:#2dd4bf; --brand-ink:#5eead4; --brand-soft:#12352f;
      --ok:#4ade80; --ok-bg:#13251a; --bad:#f87171; --bad-bg:#2a1516;
      --warn:#fbbf24; --warn-bg:#2a2011; --info:#60a5fa; --info-bg:#111e33;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 64px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 18px;flex-wrap:wrap}
  .title{display:flex;align-items:center;gap:10px}
  .title h1{font-size:18px;margin:0;letter-spacing:-.01em}
  .badge{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:6px;background:var(--brand);color:#fff}
  .actions{display:flex;gap:8px}
  .btn{text-decoration:none;font-size:13px;padding:7px 13px;border-radius:9px;border:1px solid var(--line);color:var(--muted);background:var(--card);cursor:pointer;font-family:inherit}
  .btn:hover{color:var(--ink);border-color:var(--muted)}

  /* 고정 위험군 카드 */
  .risk-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .rcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;cursor:pointer;font:inherit;text-align:left;width:100%}
  .rcard:hover{border-color:var(--brand)}
  .rcard.bad{border-left-color:var(--bad)} .rcard.warn{border-left-color:var(--warn)}
  .rcard .r-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .rcard .r-val{font-family:var(--mono);font-size:30px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
  .rcard .r-val .r-tot{font-family:var(--sans);font-size:14px;color:var(--muted)}
  .rcard .r-hint{font-size:11px;color:var(--brand);margin-top:5px}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
  .tab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;font-family:inherit;margin-bottom:-1px}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
  .tab-panel.hidden{display:none}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 16px;font-weight:600}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .search,.filter-sel{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--ink);font-size:14px;font-family:inherit}
  .search{flex:1;min-width:150px}
  .search:focus,.filter-sel:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}

  table{border-collapse:collapse;width:100%;font-size:13px;min-width:460px}
  .tbl-scroll{overflow-x:auto}
  th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  tr.month-sep td{background:var(--field);font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
  tr.risk-row td{background:rgba(239,68,68,.06)}
  tr.risk-row td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
  td.risk-val{color:var(--bad);font-weight:700}

  .role-badge{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:6px;background:var(--field);color:var(--muted)}
  .role-badge.admin{background:var(--brand);color:#fff}
  .role-badge.superadmin{background:var(--bad);color:#fff}
  .role-sel,.status-sel{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font-family:inherit;font-size:12px;cursor:pointer}
  .hchip{font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600}
  .hchip.h-ok{color:var(--ok);background:var(--ok-bg)} .hchip.h-warn{color:var(--warn);background:var(--warn-bg)}
  .hchip.h-bad{color:var(--bad);background:var(--bad-bg)} .hchip.h-none{color:var(--muted);background:var(--field)}
  .st-chip{font-size:11px;padding:2px 8px;border-radius:6px}
  .st-active{color:var(--ok);background:var(--ok-bg)} .st-dormant{color:var(--warn);background:var(--warn-bg)} .st-withdrawn{color:var(--bad);background:var(--bad-bg)}
  .muted-dash{color:var(--muted);font-size:13px}
  .manage-cell{white-space:nowrap}
  .manage-cell > *{vertical-align:middle}
  .manage-cell > * + *{margin-left:8px}
  .btn-view{background:var(--card);border:1px solid var(--line);color:var(--brand);padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn-view:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  .act-chip{font-family:var(--mono);font-size:12px;color:var(--brand-ink)}
  .act-chip.fail{color:var(--bad)}

  /* 분포 숫자형 */
  .dist{display:flex;flex-direction:column;gap:2px}
  .dist-item{display:flex;align-items:center;gap:10px;padding:10px 8px;border:none;background:none;border-radius:8px;cursor:pointer;font:inherit;width:100%;text-align:left;border-bottom:1px solid var(--line)}
  .dist-item:hover{background:var(--field)}
  .di-dot{width:9px;height:9px;border-radius:50%;flex:none}
  .di-label{flex:1;font-size:14px}
  .di-val{font-family:var(--mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
  .di-pct{font-family:var(--sans);font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}

  .chart-title{font-size:12px;color:var(--muted)}

  .pager{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px}
  .pager-info{font-size:12px;color:var(--muted);margin-right:auto}
  .pg{min-width:32px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;font-family:inherit}
  .pg:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
  .pg.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .pg:disabled{opacity:.4;cursor:default}

  .modal-overlay{position:fixed;inset:0;background:rgba(10,15,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;z-index:100}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.35);max-width:700px;width:100%;padding:26px;position:relative}
  .modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;line-height:1}
  .modal-close:hover{color:var(--ink)}
  .detail-head2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .detail-name{font-size:19px;font-weight:700}
  .detail-meta{color:var(--muted);font-size:13px;margin:8px 0 0}
  h3.sub2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px;font-weight:600}
  .vitals{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}
  .vit{background:var(--field);border-radius:10px;padding:12px 10px;text-align:center}
  .vit-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .vit-val{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
  .vit-val span{font-family:var(--sans);font-size:11px;color:var(--muted);margin-left:2px}
  .btn-del-user{margin-top:18px;background:none;border:1px solid var(--bad);color:var(--bad);padding:8px 14px;border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit}
  .btn-del-user:hover{background:var(--bad-bg)}
  .mtabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
  .mtab{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);color:var(--muted);
    padding:6px 11px;border-radius:999px;font-size:12px;font-family:var(--mono);cursor:pointer}
  .mtab:hover{border-color:var(--brand);color:var(--ink)}
  .mtab.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .mtab-n{font-family:var(--sans);font-size:10px;background:var(--field);color:var(--muted);border-radius:999px;padding:1px 6px}
  .mtab.active .mtab-n{background:rgba(255,255,255,.25);color:#fff}
  .ins-narr{background:var(--field);border-left:3px solid var(--brand);border-radius:0 10px 10px 0;padding:12px 14px}
  .ins-line{font-size:13px;line-height:1.7}
  .row-click{cursor:pointer}
  .row-click:hover{background:var(--field)}

  .dp-pop{position:fixed;z-index:200;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:10px;width:236px}
  .dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .dp-head b{font-size:13px}
  .dp-nav{background:none;border:none;font-size:16px;color:var(--muted);cursor:pointer;padding:2px 9px;border-radius:6px}
  .dp-nav:hover{background:var(--field);color:var(--ink)}
  .dp-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
  .dp-dows span{text-align:center;font-size:10px;color:var(--muted)}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .dp-grid span{height:30px}
  .dp-day{height:30px;border:none;background:none;border-radius:7px;font-size:12px;color:var(--ink);cursor:pointer;font-family:inherit;font-variant-numeric:tabular-nums}
  .dp-day:hover{background:var(--field)}
  .dp-day.sel{background:var(--brand);color:#fff}
  .dp-clear{width:100%;margin-top:8px;background:none;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit}

  /* guard */
  .guard{max-width:420px;margin:12vh auto;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:36px 28px}
  .guard h1{font-size:19px;margin:0 0 8px}
  .guard p{color:var(--muted);font-size:14px;margin:0 0 20px}
  .guard label{display:block;text-align:left;font-size:12px;color:var(--muted);margin-bottom:12px}
  .guard label span{display:block;margin-bottom:5px}
  .guard input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font-size:15px;font-family:inherit}
  .guard input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
  .guard .row{display:flex;gap:8px;margin-top:8px}
  .guard .row button{flex:1}
  .primary{background:var(--brand);color:#fff;border:none;padding:11px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .primary:hover{background:var(--brand-ink)}
  .lineb{background:var(--card);color:var(--brand);border:1px solid var(--brand);padding:11px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .gmsg{font-size:13px;min-height:18px;margin-top:12px}
  .gmsg.err{color:var(--bad)} .gmsg.ok{color:var(--ok)}
  .hidden{display:none}
  /* AI 소견 카드 */
  .ai-card{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
  .ai-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .ai-src{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
  .ai-src.gpt{background:rgba(91,141,239,.15);color:#5b8def}
  .ai-src.mock{background:rgba(140,150,160,.15);color:var(--muted)}
  .ai-narr{font-size:14px;line-height:1.7;margin:0 0 12px;color:var(--ink)}
  .ai-risk{display:flex;align-items:baseline;gap:10px;margin-top:6px}
  .ai-risk-pct{font-size:30px;font-weight:800;line-height:1}
  .ai-risk-meta{font-size:13px;color:var(--muted)}
  .ai-bar{height:7px;border-radius:6px;background:rgba(140,150,160,.18);margin:8px 0 4px;overflow:hidden}
  .ai-bar-fill{height:100%;border-radius:6px;transition:width .4s}
  .ai-drivers{font-size:12.5px;color:var(--muted);margin-top:6px}
  .ai-foot{font-size:11.5px;color:var(--muted);margin:8px 0 0}
  .mini-chart{margin:10px 0}
  .mini-title{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
  @media (max-width:760px){ .risk-cards{grid-template-columns:repeat(2,1fr)} .cols{grid-template-columns:1fr} .vitals{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="wrap">
  <section class="guard hidden" id="guard">
    <h1 id="guardTitle">관리자 로그인</h1>
    <p id="guardMsg">관리자 계정으로 로그인하면 대시보드가 열려요.</p>
    <label><span>아이디</span><input id="gu" autocomplete="username"></label>
    <label><span>비밀번호</span><input id="gp" type="password" autocomplete="current-password"></label>
    <div class="row"><button class="primary" id="gLogin">로그인</button><button class="lineb" id="gSignup">회원가입</button></div>
    <div class="gmsg" id="gMsg"></div>
    <p style="margin:18px 0 0"><a class="btn" href="/ui">일반 기록 화면으로</a></p>
  </section>

  <div class="hidden" id="board">
    <header>
      <div class="title"><h1>관리자 대시보드</h1><span class="badge" id="adminName">admin</span></div>
      <div class="actions"><a class="btn" href="/ui">기록 화면</a><button class="btn" id="logoutBtn">로그아웃</button></div>
    </header>

    <!-- 고정 위험군 카드 -->
    <div class="risk-cards" id="riskCards"></div>

    <nav class="tabs">
      <button class="tab active" data-tab="users">회원</button>
      <button class="tab" data-tab="admins">관리자</button>
      <button class="tab" data-tab="logs">활동 로그</button>
      <button class="tab" data-tab="stats">통계</button>
    </nav>

    <!-- 회원 탭 -->
    <div class="tab-panel" id="tab-users">
      <section class="card">
        <h2>회원 관리</h2>
        <div class="toolbar"><input class="search" id="userSearch" placeholder="이름으로 검색…" autocomplete="off"></div>
        <div class="tbl-scroll"><table>
          <thead><tr><th>ID</th><th>이름</th><th>인적정보</th><th>계정 상태</th><th>건강 상태</th><th>검진</th><th>상세</th></tr></thead>
          <tbody id="usersBody"></tbody></table></div>
        <div class="muted-dash" id="noUsers" style="display:none;padding:16px 0">검색 결과가 없어요.</div>
        <div class="pager" id="userPager"></div>
      </section>
    </div>

    <!-- 관리자 탭 -->
    <div class="tab-panel hidden" id="tab-admins">
      <section class="card">
        <h2>관리자 권한</h2>
        <p class="muted-dash" id="adminHint" style="margin:-6px 0 12px"></p>
        <div class="toolbar" id="promoteBox"></div>
        <div class="tbl-scroll"><table>
          <thead><tr><th>ID</th><th>이름</th><th>현재 권한</th><th>권한 변경</th></tr></thead>
          <tbody id="adminsBody"></tbody></table></div>
      </section>
    </div>

    <!-- 활동 로그 탭 -->
    <div class="tab-panel hidden" id="tab-logs">
      <section class="card">
        <h2>활동 로그</h2>
        <div class="toolbar">
          <select class="filter-sel" id="logAction"><option value="">모든 동작</option></select>
          <input type="text" class="filter-sel" id="logStart" placeholder="시작일 클릭" readonly>
          <input type="text" class="filter-sel" id="logEnd" placeholder="종료일 클릭" readonly>
          <input class="search" id="logSearch" placeholder="사용자·상세 검색…" autocomplete="off">
        </div>
        <div class="tbl-scroll"><table>
          <thead><tr><th>시각</th><th>사용자</th><th>동작</th><th>상세</th></tr></thead>
          <tbody id="logsBody"></tbody></table></div>
        <div class="muted-dash" id="noLogs" style="display:none;padding:16px 0">해당하는 로그가 없어요.</div>
        <div class="pager" id="logPager"></div>
      </section>
    </div>

    <!-- 통계 탭 -->
    <div class="tab-panel hidden" id="tab-stats">
      <section class="card"><h2>월별 평균 추이 (활성 회원)</h2><div id="trendChart"></div></section>
      <p class="muted-dash" style="margin:-4px 2px 12px">↓ 분포 항목을 클릭하면 해당 회원 목록과 추이를 볼 수 있어요.</p>
      <div class="cols">
        <section class="card"><h2>회원 BMI 분포 (최신)</h2><div class="dist" id="bmiUserDist"></div></section>
        <section class="card"><h2>회원 혈압 분포 (최신)</h2><div class="dist" id="bpUserDist"></div></section>
      </div>
      <section class="card"><h2>회원 혈당 분포 (최신)</h2><div class="dist" id="sugarUserDist"></div></section>
    </div>
  </div>

  <div class="modal-overlay hidden" id="userModal">
    <div class="modal"><button class="modal-close" id="modalClose" aria-label="닫기">✕</button><div id="userDetailBody"></div></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const token = () => localStorage.getItem("token");
const authHead = () => ({ "Authorization": "Bearer " + token() });
let myRole = "";
let usersCache = [], userPage = 1, userQuery = "";
let logsCache = [], logPage = 1, logQuery = "", logActionFilter = "", logStart = "", logEnd = "";
const U_SIZE = 10, L_SIZE = 15;
const STATUS_KO = {active:"활성", dormant:"휴면", withdrawn:"탈퇴"};

/* ---------- 인증 ---------- */
function showGuard(t,m){ $("guard").classList.remove("hidden"); $("board").classList.add("hidden"); if(t)$("guardTitle").textContent=t; if(m)$("guardMsg").textContent=m; }
$("logoutBtn").onclick=()=>{ localStorage.removeItem("token"); localStorage.removeItem("name"); checkAuth(); };
$("gLogin").onclick=async()=>{ const m=$("gMsg"); m.className="gmsg"; m.textContent="";
  const res=await fetch("/login",{method:"POST",body:new URLSearchParams({username:$("gu").value,password:$("gp").value})});
  if(res.ok){ const d=await res.json(); localStorage.setItem("token",d.access_token); localStorage.setItem("name",$("gu").value); checkAuth(); }
  else { const e=await res.json(); m.className="gmsg err"; m.textContent=e.detail||"로그인 실패"; } };
$("gSignup").onclick=async()=>{ const m=$("gMsg"); m.className="gmsg"; m.textContent="";
  const res=await fetch("/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("gu").value,password:$("gp").value})});

async function checkAuth(){
  if(!token()){ showGuard("관리자 로그인","관리자 계정으로 로그인하면 대시보드가 열려요."); return; }
  const meRes=await fetch("/me",{headers:authHead()});
  if(meRes.status===401){ showGuard("관리자 로그인","세션이 만료됐어요. 다시 로그인해 주세요."); return; }
  const me=await meRes.json();
  if(me.role!=="admin"&&me.role!=="superadmin"){ showGuard("관리자 권한이 없어요",`${me.username}님은 일반 사용자예요. 관리자 계정으로 로그인해 주세요.`); return; }

}

/* ---------- 공통 ---------- */
function statusColor(cat){
  if(cat==="정상") return "var(--ok)";
  if(["비만","고혈압","당뇨 의심"].includes(cat)) return "var(--bad)";
  if(cat==="저체중") return "var(--info)";
  return "var(--warn)";
}
function healthChip(h){
  if(!h) return `<span class="hchip h-none">—</span>`;
  const c=h==="위험"?"h-bad":(h==="주의"?"h-warn":"h-ok");
  return `<span class="hchip ${c}">${h}</span>`;
}
function lineChart(series, color, bands){
  const clean=series.filter(s=>s.value!=null);
  if(!clean.length) return `<div class="muted-dash">데이터 없음</div>`;
  const W=560,H=190,pl=44,pr=44,pt=16,pb=26,n=clean.length;
  const vals=clean.map(s=>s.value); let mn=Math.min(...vals),mx=Math.max(...vals);
  if(bands) bands.forEach(b=>{ mn=Math.min(mn,b.y); mx=Math.max(mx,b.y); });
  if(mn===mx){ mn-=1; mx+=1; }
  const pad=(mx-mn)*0.08; mn-=pad; mx+=pad;
  const iw=W-pl-pr, ih=H-pt-pb;
  const X=i=> pl+(n===1?iw/2:iw*i/(n-1));
  const Y=v=> pt+ih*(1-(v-mn)/(mx-mn));
  const pts=clean.map((s,i)=>`${X(i).toFixed(1)},${Y(s.value).toFixed(1)}`).join(" ");
  const area=`${pl},${(pt+ih).toFixed(1)} ${pts} ${X(n-1).toFixed(1)},${(pt+ih).toFixed(1)}`;
  let bandSvg="";
  if(bands) bands.forEach(b=>{ const yy=Y(b.y);
    bandSvg+=`<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W-pr}" y2="${yy.toFixed(1)}" stroke="${b.color}" stroke-width="1" stroke-dasharray="4 3" opacity=".6"/>`+
      `<text x="${W-pr+3}" y="${(yy+3).toFixed(1)}" font-size="9" fill="${b.color}">${b.label}</text>`; });
  const few=n<=14;
  const dots=few?clean.map((s,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(s.value).toFixed(1)}" r="3" fill="${color}"/>`).join(""):"";
  const vlab=few?clean.map((s,i)=>`<text x="${X(i).toFixed(1)}" y="${(Y(s.value)-8).toFixed(1)}" font-size="10" text-anchor="middle" fill="var(--ink)">${s.value}</text>`).join(""):"";
  const step=Math.max(1,Math.ceil(n/8));
  const xlab=clean.map((s,i)=>(i%step===0||i===n-1)?`<text x="${X(i).toFixed(1)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${s.label}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block">
    ${bandSvg}<polygon points="${area}" fill="${color}" opacity="0.08"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>${dots}${vlab}${xlab}</svg>`;
}
function monthRows(records, cells){
  const asc=records.slice().sort((a,b)=> a.date<b.date?1:-1); // 최신 먼저
  let html="", cur="";
  for(const r of asc){ const m=r.date.slice(0,7);
    if(m!==cur){ cur=m; html+=`<tr class="month-sep"><td colspan="9">${m}</td></tr>`; }
    html+=`<tr>${cells(r)}</tr>`; }
  return html;
}

/* ---------- 데이터 로드 ---------- */
async function loadBoard(){
  const [users, logs, hs] = await Promise.all([
    fetch("/admin/users",{headers:authHead()}).then(r=>r.json()),
    fetch("/admin/logs?limit=500",{headers:authHead()}).then(r=>r.json()),
    fetch("/admin/health-stats",{headers:authHead()}).then(r=>r.json()),
  ]);
  // 고정 위험군 카드
  const rk=hs.risk, uc=hs.user_count;
  const rc=(m,c,label,val,tot)=>`<button class="rcard ${c==="warning"||["비만","고혈압","당뇨 의심"].includes(c)?"bad":"warn"}" data-m="${m}" data-c="${c}">
    <div class="r-label">${label}</div><div class="r-val">${val}<span class="r-tot">/${tot}명</span></div><div class="r-hint">클릭 → 회원 목록</div></button>`;
  $("riskCards").innerHTML =
    rc("bmi","비만","비만 회원",rk.obese,uc)+rc("bp","고혈압","고혈압 회원",rk.hypertension,uc)+
    rc("sugar","당뇨 의심","당뇨 의심 회원",rk.diabetes,uc)+rc("warning","warning","경고 있는 회원",rk.any_warning,uc);
  $("riskCards").querySelectorAll(".rcard").forEach(b=>b.onclick=()=>openGroupDetail(b.dataset.m,b.dataset.c));

  usersCache=users.users; userPage=1; renderUsers(); renderAdmins();
  logsCache=logs.logs; logPage=1;
  const actions=[...new Set(logsCache.map(l=>l.action))].sort();
  $("logAction").innerHTML=`<option value="">모든 동작</option>`+actions.map(a=>`<option value="${a}">${a}</option>`).join("");
  renderLogs();

  // 추이 — 분기별 위험 판정 비율(%)
  const mo=hs.monthly||[];
  $("trendChart").innerHTML=
    `<div class="chart-title">분기별 위험 판정 비율 (%) — 전체 활성 회원</div>`+
    (mo.length? lineChart(mo.map(m=>({label:"Q"+m.quarter,value:m.risk_pct})),"var(--bad)",
        [{y:30,label:"30%",color:"var(--warn)"}]) : `<div class="muted-dash">데이터 없음</div>`);
  distNumbers($("bmiUserDist"),hs.bmi_user_dist,["저체중","정상","과체중","비만"],"bmi");
  distNumbers($("bpUserDist"),hs.bp_user_dist,["정상","주의","고혈압"],"bp");
  distNumbers($("sugarUserDist"),hs.sugar_user_dist,["정상","공복혈당장애","당뇨 의심"],"sugar");
}

function distNumbers(container,obj,order,metric){
  const items=order.filter(k=>obj[k]!=null).map(k=>({label:k,value:obj[k]}));
  const total=items.reduce((s,i)=>s+i.value,0);
  container.innerHTML=items.length?items.map(i=>{ const c=statusColor(i.label), pct=total?Math.round(i.value/total*100):0;
    return `<button class="dist-item bar-click" data-metric="${metric}" data-cat="${i.label}">
      <span class="di-dot" style="background:${c}"></span><span class="di-label">${i.label}</span>
      <span class="di-val" style="color:${c}">${i.value}<span class="di-pct">명 · ${pct}%</span></span></button>`;
  }).join(""):`<div class="muted-dash">데이터 없음</div>`;
  container.querySelectorAll(".bar-click").forEach(b=>b.onclick=()=>openGroupDetail(b.dataset.metric,b.dataset.cat));
}

/* ---------- 페이지네이션 ---------- */
function renderPager(el,page,pages,total,unit,onGo){
  if(total===0){ el.innerHTML=""; return; }
  let html=`<span class="pager-info">총 ${total}${unit} · ${page}/${pages}페이지</span>`;
  if(pages>1){ html+=`<button class="pg" ${page<=1?"disabled":""} data-p="${page-1}">‹</button>`;
    const s=Math.max(1,page-2),e=Math.min(pages,page+2);
    for(let p=s;p<=e;p++) html+=`<button class="pg ${p===page?"active":""}" data-p="${p}">${p}</button>`;
    html+=`<button class="pg" ${page>=pages?"disabled":""} data-p="${page+1}">›</button>`; }
  el.innerHTML=html;
  el.querySelectorAll(".pg").forEach(b=>{ if(!b.disabled) b.onclick=()=>onGo(parseInt(b.dataset.p)); });
}

/* ---------- 회원 탭 (계정 상태 + 건강 상태) ---------- */
function renderUsers(){
  const q=userQuery.trim().toLowerCase();
  const list=q?usersCache.filter(u=>((u.name||"")+(u.username||"")).toLowerCase().includes(q)):usersCache;
  const pages=Math.max(1,Math.ceil(list.length/U_SIZE));
  if(userPage>pages) userPage=pages;
  const slice=list.slice((userPage-1)*U_SIZE,userPage*U_SIZE);
  $("noUsers").style.display=list.length?"none":"block";
  const stOpt=(cur)=>["active","dormant","withdrawn"].map(s=>`<option value="${s}" ${cur===s?"selected":""}>${STATUS_KO[s]}</option>`).join("");
  $("usersBody").innerHTML=slice.map(u=>{
    const risk=u.health==="위험";
    const ctrl=`<select class="status-sel" data-id="${u.id}">${stOpt(u.status)}</select>`;
    const info=u.age?`${u.age}세 ${u.sex==="M"?"남":"여"}${u.smoker?" · 흡연":""}`:"—";
    return `<tr class="${risk?"risk-row":""}"><td class="num">${u.id}</td><td>${u.name||u.username||"—"}</td>`+
      `<td>${info}</td>`+
      `<td>${ctrl}</td><td>${healthChip(u.health)}</td>`+
      `<td class="num">${u.record_count}</td>`+
      `<td class="manage-cell"><button class="btn-view" data-id="${u.id}">상세</button></td></tr>`;
  }).join("");
  $("usersBody").querySelectorAll(".btn-view").forEach(b=>b.onclick=()=>loadUserDetail(parseInt(b.dataset.id)));
  $("usersBody").querySelectorAll(".status-sel").forEach(s=>s.onchange=()=>setStatus(parseInt(s.dataset.id),s.value));
  renderPager($("userPager"),userPage,pages,list.length,"명",(p)=>{ userPage=p; renderUsers(); });
}
$("userSearch").oninput=(e)=>{ userQuery=e.target.value; userPage=1; renderUsers(); };

async function setStatus(id,status){

/* ---------- 관리자 탭 (권한) ---------- */
function renderAdmins(){
  const isSuper=myRole==="superadmin";
  $("adminHint").textContent=isSuper?"관리자·슈퍼관리자 목록. 아래에서 일반 회원을 관리자로 지정할 수 있어요.":"조회 전용 (권한 변경은 슈퍼관리자만).";
  const rOpt=(cur)=>["user","admin","superadmin"].map(v=>`<option value="${v}" ${cur===v?"selected":""}>${v}</option>`).join("");
  const admins=usersCache.filter(u=>u.role!=="user");
  $("adminsBody").innerHTML=admins.map(u=>{
    const ctrl=isSuper?`<select class="role-sel" data-id="${u.id}">${rOpt(u.role)}</select>`:`<span class="muted-dash">-</span>`;
    return `<tr><td class="num">${u.id}</td><td>${u.username||"—"}</td>`+
      `<td><span class="role-badge ${u.role}">${u.role}</span></td><td>${ctrl}</td></tr>`;
  }).join("")||`<tr><td colspan="4" class="muted-dash">관리자가 없어요.</td></tr>`;
  if(isSuper) $("adminsBody").querySelectorAll(".role-sel").forEach(s=>s.onchange=()=>setRole(parseInt(s.dataset.id),s.value));
  // 일반 회원 → 관리자 승격
  if(isSuper){
    const regs=usersCache.filter(u=>u.role==="user"&&u.status==="active");
    $("promoteBox").innerHTML=`<select class="filter-sel" id="promoteSel"><option value="">일반 회원 선택…</option>`+
      regs.map(u=>`<option value="${u.id}">${u.username}</option>`).join("")+`</select><button class="btn" id="promoteBtn">관리자로 지정</button>`;
    $("promoteBtn").onclick=()=>{ const id=$("promoteSel").value; if(id) setRole(parseInt(id),"admin"); };
  } else { $("promoteBox").innerHTML=""; }
}
async function setRole(id,role){
  const res=await fetch(`/admin/users/${id}/role`,{method:"PUT",headers:{"Content-Type":"application/json",...authHead()},body:JSON.stringify({role})});
  if(!res.ok){ const e=await res.json(); alert(e.detail||"권한 변경 실패"); }
  loadBoard();
}

/* ---------- 활동 로그 ---------- */
function renderLogs(){
  let list=logsCache;
  if(logActionFilter) list=list.filter(l=>l.action===logActionFilter);
  if(logStart) list=list.filter(l=>(l.created_at||"").slice(0,10)>=logStart);
  if(logEnd) list=list.filter(l=>(l.created_at||"").slice(0,10)<=logEnd);
  const q=logQuery.trim().toLowerCase();
  if(q) list=list.filter(l=>(l.username||"").toLowerCase().includes(q)||(l.detail||"").toLowerCase().includes(q));
  const pages=Math.max(1,Math.ceil(list.length/L_SIZE));
  if(logPage>pages) logPage=pages;
  const slice=list.slice((logPage-1)*L_SIZE,logPage*L_SIZE);
  $("noLogs").style.display=list.length?"none":"block";
  $("logsBody").innerHTML=slice.map(l=>{ const t=(l.created_at||"").replace("T"," ").slice(0,19); const fail=l.action==="login_failed";
    return `<tr><td class="num">${t}</td><td>${l.username||"—"}</td><td><span class="act-chip ${fail?"fail":""}">${l.action}</span></td><td>${l.detail||"—"}</td></tr>`;
  }).join("");
  renderPager($("logPager"),logPage,pages,list.length,"건",(p)=>{ logPage=p; renderLogs(); });
}
$("logAction").onchange=(e)=>{ logActionFilter=e.target.value; logPage=1; renderLogs(); };

/* ---------- 그룹 상세 (기간 필터 + 위험군 색상) ---------- */
async function openGroupDetail(metric,category){
  const res=await fetch(`/admin/health-group?metric=${metric}&category=${encodeURIComponent(category)}`,{headers:authHead()});
  if(!res.ok){ alert("불러오지 못했어요."); return; }
  const d=await res.json();
  const mname=d.unit||metric;
  const isRisk=["비만","고혈압","당뇨 의심","경고 있는 회원","위험군"].includes(d.category);
  const rowsHtml=(list)=>list.map(u=>
    `<tr class="row-click ${isRisk?"risk-row":""}" data-id="${u.id}"><td>${isRisk?"⚠ ":""}${u.username}</td>`+
    `<td class="num ${isRisk?"risk-val":""}">${u.value}</td><td class="num">${u.date}</td></tr>`).join("")
    ||`<tr><td colspan="3" class="muted-dash">회원 없음</td></tr>`;
  $("userDetailBody").innerHTML=`
    <div class="detail-head2"><span class="detail-name">${d.category}</span><span class="role-badge">${d.user_count}명</span></div>
    <p class="detail-meta">최신 기록 기준 · ${mname} · 이름 클릭 시 상세</p>
    <div class="toolbar"><input class="filter-sel" id="grpStart" placeholder="시작월" readonly><input class="filter-sel" id="grpEnd" placeholder="종료월" readonly><button class="btn" id="grpReset">전체</button></div>
    <h3 class="sub2">그룹 월별 평균 ${mname}</h3><div id="grpTrend"></div>
    <h3 class="sub2">회원 목록 (${mname} 높은 순, ${d.user_count}명)</h3>
    <div class="tbl-scroll" style="max-height:320px;overflow:auto"><table>
      <thead><tr><th>이름</th><th>${mname}</th><th>측정일</th></tr></thead><tbody>${rowsHtml(d.users)}</tbody></table></div>`;
  function renderTrend(){
    const s=$("grpStart").value, e=$("grpEnd").value;
    let mon=d.monthly;
    if(s) mon=mon.filter(m=>m.month>=s.slice(0,7));
    if(e) mon=mon.filter(m=>m.month<=e.slice(0,7));
    $("grpTrend").innerHTML=lineChart(mon.map(m=>({label:m.month.slice(5),value:m.avg})),"var(--brand)");
  }
  attachDatePicker($("grpStart")); attachDatePicker($("grpEnd"));
  $("grpStart").addEventListener("change",renderTrend); $("grpEnd").addEventListener("change",renderTrend);
  $("grpReset").onclick=()=>{ $("grpStart").value=""; $("grpEnd").value=""; renderTrend(); };
  renderTrend();
  $("userDetailBody").querySelectorAll(".row-click").forEach(tr=>tr.onclick=()=>loadUserDetail(parseInt(tr.dataset.id)));
  $("userModal").classList.remove("hidden");
}

/* ---------- 회원 상세 (검진 시계열 + AI 소견) ---------- */
const GKO={0:"정상",1:"주의",2:"위험"};
const gradeColor=(g)=>g===2?"var(--bad)":g===1?"#e8a33d":"var(--ok)";
async function loadUserDetail(id){
  const [res, aiRes]=await Promise.all([
    fetch(`/admin/users/${id}`,{headers:authHead()}),
    fetch(`/admin/users/${id}/ai-insight`,{headers:authHead()}),
  ]);
  if(!res.ok){ alert("회원 정보를 불러오지 못했어요."); return; }
  const d=await res.json();
  const ai=aiRes.ok?await aiRes.json():null;
  const cks=d.checkups||[];
  const last=cks.length?cks[cks.length-1]:null;
  const who=`${d.age??"?"}세 · ${d.sex==="M"?"남성":"여성"} · ${d.smoker?"흡연":"비흡연"}`;
  const stChip=`<span class="st-chip st-${d.status}">${STATUS_KO[d.status]||d.status}</span>`;
  const vitals=last?`<div class="vitals">
      <div class="vit"><div class="vit-label">BMI</div><div class="vit-val">${last.bmi}</div></div>
      <div class="vit"><div class="vit-label">허리둘레</div><div class="vit-val">${last.waist}<span>cm</span></div></div>
      <div class="vit"><div class="vit-label">혈압</div><div class="vit-val">${last.systolic}/${last.diastolic}</div></div>
      <div class="vit"><div class="vit-label">공복혈당</div><div class="vit-val">${last.fbs}<span>mg/dL</span></div></div>
      <div class="vit"><div class="vit-label">종합판정</div><div class="vit-val" style="color:${gradeColor(last.grade)}">${GKO[last.grade]}</div></div>
    </div>`:`<p class="muted-dash" style="margin:16px 0">검진 기록이 없어요.</p>`;

  // ----- AI 소견 카드 -----
  let aiHtml="";
  if(ai){
    const risk=ai.data.risk||{}, eff=(ai.data.insights&&ai.data.insights.effects)||[];
    let riskLine="";
    if(risk.available&&risk.eligible&&risk.prob!=null){
      const pct=(risk.prob*100).toFixed(0), base=((risk.baseline||0)*100).toFixed(0);
      const lvl=risk.prob>=(risk.baseline*2)?"높음":risk.prob>=risk.baseline?"보통":"낮음";
      const col=lvl==="높음"?"var(--bad)":lvl==="보통"?"#e8a33d":"var(--ok)";
      const w=Math.min(100,risk.prob*100).toFixed(0);
      riskLine=`<div class="ai-risk"><span class="ai-risk-pct" style="color:${col}">${pct}%</span>
        <span class="ai-risk-meta">다음 분기 위험 전환 확률 · 평균 ${base}% 대비 <b style="color:${col}">${lvl}</b></span></div>
        <div class="ai-bar"><div class="ai-bar-fill" style="width:${w}%;background:${col}"></div></div>`;
      if((risk.drivers||[]).length) riskLine+=`<div class="ai-drivers">주요 위험 요인: ${risk.drivers.map(x=>x.feature).join(" · ")}</div>`;
    } else if(risk.available&&!risk.eligible){
      riskLine=`<div class="ai-risk-meta">현재 위험군 — 전환 예측 대상이 아닌 직접 관리 대상</div>`;
    } else if(!risk.available){
      riskLine=`<div class="ai-risk-meta">예측 모델 미탑재 (models/risk_model.joblib 없음)</div>`;
    }
    const sig=eff.filter(e=>e.verdict==="유의");
    const effRows=sig.map(e=>
      `<tr><td>${e.tag}</td><td>${e.metric_ko}</td>`+
      `<td class="num" style="color:${e.direction==="감소"?"var(--ok)":"var(--bad)"};font-weight:600">${e.delta>0?"+":""}${e.delta}</td>`+
      `<td class="num">${e.n}</td><td class="num">[${e.ci_low}, ${e.ci_high}]</td><td class="num">${e.p_adj}</td></tr>`).join("");
    aiHtml=`<div class="ai-card">
      <div class="ai-head"><h3 class="sub2" style="margin:0">AI 소견</h3><span class="ai-src ${ai.narrative.source}">${ai.narrative.source==="gpt"?"GPT":"규칙기반"}</span></div>
      <p class="ai-narr">${ai.narrative.text}</p>
      ${riskLine}
      ${effRows?`<div class="tbl-scroll" style="margin-top:12px"><table>
        <thead><tr><th>행동</th><th>지표</th><th>변화</th><th>n</th><th>95% 신뢰구간</th><th>보정 p</th></tr></thead>
        <tbody>${effRows}</tbody></table></div>
        <p class="ai-foot">다중비교 보정 후 p&lt;0.05 이고 신뢰구간이 0을 넘지 않는 ‘유의’ 효과만 표시</p>`:
        `<p class="ai-foot">통계적으로 유의한 행동–지표 연관은 관찰되지 않음</p>`}
    </div>`;
  }
  const actionBtn=(myRole==="superadmin"&&d.status!=="withdrawn")?`<button class="btn-del-user" id="wdBtn">회원 탈퇴 처리</button>`:"";
  const avgTxt=d.stats?`평균 BMI ${d.stats.avg_bmi ?? "—"} · 최근 판정 ${d.stats.latest_grade||"—"}`:"검진 없음";
  $("userDetailBody").innerHTML=`
    <div class="detail-head2"><span class="detail-name">${d.name||d.username}</span><span class="role-badge ${d.role}">${d.role}</span>${stChip}</div>
    <p class="detail-meta">${who} · 총 ${d.record_count}건 검진 · ${avgTxt}</p>
    <h3 class="sub2">최근 검진</h3>${vitals}
    ${aiHtml}
    <h3 class="sub2">검진 추이</h3>
    <div id="detTrend"></div>
    <h3 class="sub2">검진 이력</h3>
    <div id="detTable"></div>${actionBtn}`;

  // 분기별 추이 (혈압·혈당·BMI + 판정 밴드)
  const asc=cks.slice().sort((a,b)=>a.quarter-b.quarter);
  if(asc.length){
    $("detTrend").innerHTML=
      `<div class="mini-chart"><div class="mini-title">수축기 혈압</div>${lineChart(asc.map(c=>({label:"Q"+c.quarter,value:c.systolic})),"#d9534f",[{y:140,color:"#d9534f",label:"고혈압"},{y:120,color:"#e8a33d",label:"주의"}])}</div>`+
      `<div class="mini-chart"><div class="mini-title">공복혈당</div>${lineChart(asc.map(c=>({label:"Q"+c.quarter,value:c.fbs})),"#e8a33d",[{y:126,color:"#d9534f",label:"당뇨"},{y:100,color:"#e8a33d",label:"경계"}])}</div>`+
      `<div class="mini-chart"><div class="mini-title">체질량지수(BMI)</div>${lineChart(asc.map(c=>({label:"Q"+c.quarter,value:c.bmi})),"#5b8def",[{y:25,color:"#d9534f",label:"비만"},{y:23,color:"#e8a33d",label:"과체중"}])}</div>`;
  }
  // 검진 테이블 (분기 내림차순) + 메모 강조
  const rows=cks.slice().sort((a,b)=>b.quarter-a.quarter).map(c=>
    `<tr><td class="num">Q${c.quarter}</td><td class="num">${c.date}</td><td class="num">${c.bmi}</td>`+
    `<td class="num">${c.systolic}/${c.diastolic}</td><td class="num">${c.fbs}</td>`+
    `<td class="num">${c.ldl}</td><td class="num">${c.ggt}</td>`+
    `<td><span style="color:${gradeColor(c.grade)};font-weight:600">${GKO[c.grade]}</span></td>`+
    `<td>${c.memo||"—"}</td></tr>`).join("")||`<tr><td colspan="9" class="muted-dash">검진 없음</td></tr>`;
  $("detTable").innerHTML=`<div class="tbl-scroll" style="max-height:340px;overflow:auto"><table>
    <thead><tr><th>분기</th><th>검진일</th><th>BMI</th><th>혈압</th><th>혈당</th><th>LDL</th><th>γ-GTP</th><th>판정</th><th>생활습관 메모</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;

  if(myRole==="superadmin"&&d.status!=="withdrawn") $("wdBtn").onclick=()=>withdrawUser(d.id,d.name||d.username);
  $("userModal").classList.remove("hidden");
}
async function withdrawUser(id,name){
  if(!confirm(`'${name}' 회원을 탈퇴 처리할까요? (DB 보존, 탈퇴 표시)`)) return;
  const res=await fetch(`/admin/users/${id}`,{method:"DELETE",headers:authHead()});
  if(!res.ok){ const e=await res.json(); alert(e.detail||"실패"); return; }
  closeModal(); loadBoard();
}

/* ---------- 모달 ---------- */
function closeModal(){ $("userModal").classList.add("hidden"); }
$("modalClose").onclick=closeModal;
$("userModal").onclick=(e)=>{ if(e.target===$("userModal")) closeModal(); };
document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeModal(); });

/* ---------- 커스텀 달력 ---------- */
function attachDatePicker(input){
  if(!input||input.dataset.dp) return; input.dataset.dp="1"; input.readOnly=true; input.autocomplete="off";
  let pop=null,view=null; const pad=(x)=>String(x).padStart(2,"0"); const fmt=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
  function close(){ if(pop){ pop.remove(); pop=null; document.removeEventListener("mousedown",outside,true); window.removeEventListener("scroll",close,true);} }
  function outside(e){ if(pop&&!pop.contains(e.target)&&e.target!==input) close(); }
  function render(){ const y=view.getFullYear(),m=view.getMonth(); const sd=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),sel=input.value;
    let cells=""; for(let i=0;i<sd;i++) cells+="<span></span>";
    for(let d=1;d<=days;d++){ const ds=fmt(y,m,d); cells+=`<button type="button" class="dp-day${ds===sel?" sel":""}" data-d="${ds}">${d}</button>`; }
    pop.innerHTML=`<div class="dp-head"><button type="button" class="dp-nav" data-n="-1">‹</button><b>${y}. ${pad(m+1)}</b><button type="button" class="dp-nav" data-n="1">›</button></div>
      <div class="dp-dows"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="dp-grid">${cells}</div><button type="button" class="dp-clear">지우기</button>`;
    pop.querySelectorAll(".dp-nav").forEach(b=>b.onclick=()=>{ view=new Date(y,m+Number(b.dataset.n),1); render(); });
    pop.querySelectorAll(".dp-day").forEach(b=>b.onclick=()=>{ input.value=b.dataset.d; input.dispatchEvent(new Event("change",{bubbles:true})); close(); });
    pop.querySelector(".dp-clear").onclick=()=>{ input.value=""; input.dispatchEvent(new Event("change",{bubbles:true})); close(); };
  }
  function open(){ if(pop) return; view=input.value?new Date(input.value+"T00:00"):new Date();
    pop=document.createElement("div"); pop.className="dp-pop"; document.body.appendChild(pop);
    const r=input.getBoundingClientRect(); pop.style.left=Math.max(8,Math.min(r.left,window.innerWidth-252))+"px"; pop.style.top=(r.bottom+4)+"px";
    render(); setTimeout(()=>{ document.addEventListener("mousedown",outside,true); window.addEventListener("scroll",close,true); },0);
  }
  input.addEventListener("click",open); input.addEventListener("focus",open);
}
attachDatePicker($("logStart")); attachDatePicker($("logEnd"));

checkAuth();
</script>
