<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이 헬스 로그</title>
<style>
  :root{
    --bg:#eef2f5; --card:#ffffff; --ink:#16232e; --muted:#64748b;
    --line:#e2e8f0; --field:#f8fafc;
    --brand:#0f766e; --brand-ink:#0b5a54; --brand-soft:#d5ece9;
    --ok:#15803d; --ok-dot:#22c55e; --ok-bg:#e7f6ec;
    --warn:#b45309; --warn-dot:#f59e0b; --warn-bg:#fdf2e3;
    --bad:#b91c1c; --bad-dot:#ef4444; --bad-bg:#fdeaea;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Consolas",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    --radius:14px; --shadow:0 1px 2px rgba(16,35,46,.06),0 8px 24px rgba(16,35,46,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1317; --card:#161d23; --ink:#e6edf3; --muted:#8b98a5;
      --line:#26303a; --field:#0f161b;
      --brand:#2dd4bf; --brand-ink:#5eead4;
      --ok:#4ade80; --ok-dot:#22c55e; --ok-bg:#13251a;
      --warn:#fbbf24; --warn-dot:#f59e0b; --warn-bg:#2a2011;
      --bad:#f87171; --bad-dot:#ef4444; --bad-bg:#2a1516;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 64px}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;
    padding:6px 2px 20px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
  .pulse{width:26px;height:26px;flex:none}
  .pulse path{stroke:var(--brand);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .who{font-size:13px;color:var(--muted)}
  .who b{color:var(--ink)}
  .ghost{background:none;border:1px solid var(--line);color:var(--muted);
    padding:6px 12px;border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit}
  .ghost:hover{color:var(--ink);border-color:var(--muted)}

  /* auth */
  .auth{max-width:380px;margin:6vh auto 0;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 24px}
  .auth h1{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
  .auth p{margin:0 0 20px;color:var(--muted);font-size:14px}
  .auth .row{display:flex;gap:8px;margin-top:16px}
  .auth .row button{flex:1}

  label{display:block;font-size:12px;color:var(--muted);margin-bottom:14px;font-weight:500}
  label span{display:block;margin-bottom:5px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--field);color:var(--ink);font-size:15px;font-family:inherit}
  input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}

  button.primary{background:var(--brand);color:#fff;border:none;padding:11px 16px;
    border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  button.primary:hover{background:var(--brand-ink)}
  button.line{background:var(--card);color:var(--brand);border:1px solid var(--brand);
    padding:11px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}

  .msg{font-size:13px;min-height:18px;margin-top:12px}
  .msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}

  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    margin:0 0 14px;font-weight:600}

  /* KPI readouts */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px}
  .kpi .k-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
    display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
  .kpi .k-val{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.02em;
    margin-top:8px;font-variant-numeric:tabular-nums}
  .kpi .k-unit{font-size:13px;color:var(--muted);font-family:var(--sans);margin-left:3px}
  .kpi .k-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .kpi-click{cursor:pointer;font:inherit;text-align:left;width:100%}
  .kpi-click:hover{border-color:var(--brand)}
  .k-hint{font-size:11px;color:var(--brand);margin-top:6px}
  .memo-edit{display:flex;gap:8px;margin-top:4px}
  .memo-edit input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font-family:inherit;font-size:14px}
  .btn-memo{background:var(--brand);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
  .btn-memo:hover{background:var(--brand-ink)}
  .modal-overlay{position:fixed;inset:0;background:rgba(10,15,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;z-index:100}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.35);max-width:680px;width:100%;padding:26px;position:relative}
  .modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;line-height:1}
  .modal-close:hover{color:var(--ink)}
  .modal-title{font-size:16px;margin:0 0 14px}
  .detail-actions{display:flex;gap:8px;margin-top:18px;align-items:center}
  .detail-actions .btn-del{margin-top:0}
  .btn-edit{background:none;border:1px solid var(--brand);color:var(--brand);padding:8px 14px;border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit}
  .btn-edit:hover{background:var(--brand-soft)}
  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .edit-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .edit-grid input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font-family:inherit;font-size:14px}
  .edit-grid .ef-full{grid-column:1/-1}
  table.hist{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
  table.hist th,table.hist td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  table.hist th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  table.hist td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* weekly trend */
  .trend{display:flex;align-items:baseline;gap:12px}
  .trend .now{font-family:var(--mono);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
  .chip-change{font-family:var(--mono);font-size:15px;font-weight:600;padding:3px 9px;border-radius:8px;
    font-variant-numeric:tabular-nums}
  .chip-change.down{color:var(--ok);background:var(--ok-bg)}
  .chip-change.up{color:var(--bad);background:var(--bad-bg)}
  .chip-change.flat{color:var(--muted);background:var(--field)}
  .trend-sub{font-size:13px;color:var(--muted);margin-top:8px}

  /* form */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .grid .full{grid-column:1/-1}

  /* table */
  .tbl-scroll{overflow-x:auto;margin:0 -18px -18px;padding:0 18px}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
  th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500}
  .chip.s-ok{color:var(--ok);background:var(--ok-bg)}
  .chip.s-warn{color:var(--warn);background:var(--warn-bg)}
  .chip.s-bad{color:var(--bad);background:var(--bad-bg)}
  .warns{color:var(--bad);font-size:12px}

  .empty{text-align:center;color:var(--muted);font-size:14px;padding:28px 0}

  /* 날짜 사이드바 + 상세 */
  .log-layout{display:grid;grid-template-columns:170px 1fr;gap:16px}
  .log-side{display:flex;flex-direction:column;gap:3px;max-height:440px;overflow-y:auto;
    border-right:1px solid var(--line);padding-right:12px}
  .date-btn{display:flex;align-items:center;gap:8px;text-align:left;background:none;border:none;
    padding:9px 10px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);
    font-variant-numeric:tabular-nums}
  .date-btn:hover{background:var(--field)}
  .date-btn.active{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
  .date-btn .d-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok-dot)}
  .date-btn .d-dot.warn{background:var(--bad-dot)}
  .log-detail{min-height:200px}
  .detail-empty{color:var(--muted);font-size:14px;padding:24px 0;text-align:center}
  .detail-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
  .detail-date{font-family:var(--mono);font-size:22px;font-weight:600}
  .detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px}
  .dfield .df-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .dfield .df-val{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums;margin-top:2px}
  .dfield .df-val .df-unit{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:3px}
  .detail-warns{margin-top:16px;padding:12px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-size:13px}
  .detail-memo{margin-top:14px;font-size:14px}
  .detail-memo .dm-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:3px}
  .btn-del{margin-top:18px;background:none;border:1px solid var(--line);color:var(--bad);
    padding:8px 14px;border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit}
  .btn-del:hover{background:var(--bad-bg);border-color:var(--bad)}
  @media(max-width:560px){
    .log-layout{grid-template-columns:1fr}
    .log-side{flex-direction:row;overflow-x:auto;max-height:none;border-right:none;
      border-bottom:1px solid var(--line);padding:0 0 10px}
    .date-btn{white-space:nowrap}
  }
  .admin-link{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);
    background:var(--card);border:1px solid var(--brand);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
  .admin-link:hover{background:var(--field)}
  .admin-link span:first-child{font-weight:700;font-size:15px}
  .admin-link .arrow{font-size:12px;color:var(--brand);font-weight:600}
  h3.sub{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:22px 0 8px;font-weight:600}
  .role-badge{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:6px;
    background:var(--field);color:var(--muted)}
  .role-badge.admin{background:var(--brand);color:#fff}
  td.act{font-family:var(--mono);font-size:12px}
  .hidden{display:none}
  @media (max-width:560px){
    .kpis{grid-template-columns:1fr}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <svg class="pulse" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M2 17 h6 l3 -9 l5 17 l3 -8 h11"/>
      </svg>
      마이 헬스 로그
    </div>
    <div id="userArea" class="hidden">
      <span class="who"><b id="who"></b>님</span>
      <button class="ghost" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <!-- 로그인/회원가입 -->
  <section class="auth" id="authView">
    <h1>건강 기록 시작하기</h1>
    <p>매일의 수치를 기록하면 BMI·혈압·혈당 상태를 자동으로 분석해 드려요.</p>
    <label><span>아이디</span><input id="au" autocomplete="username"></label>
    <label><span>비밀번호</span><input id="ap" type="password" autocomplete="current-password"></label>
    <div class="row">
      <button class="primary" id="loginBtn">로그인</button>
      <button class="line" id="signupBtn">회원가입</button>
    </div>
    <div class="msg" id="authMsg"></div>
  </section>

  <!-- 앱 -->
  <main class="hidden" id="appView">

    <div class="kpis" id="kpis"><!-- JS로 채움 --></div>

    <section class="card">
      <h2>주간 리포트 · 평균 체중</h2>
      <div id="report"></div>
    </section>

    <section class="card">
      <h2>새 기록</h2>
      <form id="recForm">
        <div class="grid">
          <label class="full"><span>날짜</span><input name="date" type="date" required></label>
          <label><span>몸무게 (kg)</span><input name="weight" type="number" step="0.1" required></label>
          <label><span>키 (cm)</span><input name="height" type="number" step="0.1" required></label>
          <label><span>수축기 혈압</span><input name="systolic" type="number" required></label>
          <label><span>이완기 혈압</span><input name="diastolic" type="number" required></label>
          <label><span>공복 혈당 (mg/dL)</span><input name="blood_sugar" type="number" required></label>
          <label><span>걸음 수 (선택)</span><input name="steps" type="number" min="0"></label>
          <label><span>수면 시간 (선택)</span><input name="sleep_hours" type="number" step="0.1" min="0"></label>
          <label class="full"><span>메모 (선택)</span><input name="memo" type="text" placeholder="오늘 컨디션, 특이사항 등"></label>
        </div>
        <button class="primary" type="submit" style="width:100%">기록 추가</button>
      </form>
    </section>

    <section class="card">
      <h2>내 기록</h2>
      <div class="empty hidden" id="emptyRows">아직 기록이 없어요. 위에서 첫 기록을 추가해 보세요.</div>
      <div class="log-layout hidden" id="logLayout">
        <aside class="log-side" id="dateList"></aside>
        <div class="log-detail" id="dayDetail">
          <div class="detail-empty">왼쪽에서 날짜를 선택하면 그날 기록을 볼 수 있어요.</div>
        </div>
      </div>
    </section>

    <!-- 관리자만 보이는 대시보드 링크 -->
    <a class="admin-link hidden" id="adminLink" href="/dashboard">
      <span>관리자 대시보드</span>
      <span class="arrow">전체 사용자 · 활동 로그 · 통계 보기 →</span>
    </a>

  </main>

  <!-- 그래프/기록 팝업 -->
  <div class="modal-overlay hidden" id="uiModal">
    <div class="modal">
      <button class="modal-close" id="uiModalClose" aria-label="닫기">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const token = () => localStorage.getItem("token");
const authHead = () => ({ "Authorization": "Bearer " + token() });

function statusClass(cat){
  if (cat === "정상") return "s-ok";
  if (["비만","고혈압","당뇨 의심"].includes(cat)) return "s-bad";
  return "s-warn"; // 저체중·과체중·주의·공복혈당장애
}

function showApp(name){
  $("authView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  $("userArea").classList.remove("hidden");
  $("who").textContent = name;
  loadAll();
}
function showAuth(){
  $("appView").classList.add("hidden");
  $("userArea").classList.add("hidden");
  $("authView").classList.remove("hidden");
}

// 회원가입
$("signupBtn").onclick = async () => {
  const m = $("authMsg"); m.className = "msg"; m.textContent = "";
  const res = await fetch("/signup", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({username:$("au").value, password:$("ap").value})
  });
  if (res.ok){ m.className="msg ok"; m.textContent="가입 완료! 이제 로그인하세요."; }
  else { const e = await res.json(); m.className="msg err"; m.textContent = e.detail || "가입 실패"; }
};

// 로그인
$("loginBtn").onclick = async () => {
  const m = $("authMsg"); m.className="msg"; m.textContent="";
  const body = new URLSearchParams({username:$("au").value, password:$("ap").value});
  const res = await fetch("/login", { method:"POST", body });
  if (res.ok){
    const d = await res.json();
    localStorage.setItem("token", d.access_token);
    localStorage.setItem("name", $("au").value);
    showApp($("au").value);
  } else { const e = await res.json(); m.className="msg err"; m.textContent = e.detail || "로그인 실패"; }
};

$("logoutBtn").onclick = () => {
  localStorage.removeItem("token"); localStorage.removeItem("name"); showAuth();
};

async function loadAll(){
  const [recRes, statRes, repRes, meRes] = await Promise.all([
    fetch("/records", {headers:authHead()}),
    fetch("/stats", {headers:authHead()}),
    fetch("/report/weekly", {headers:authHead()}),
    fetch("/me", {headers:authHead()}),
  ]);
  if (recRes.status === 401){ showAuth(); return; }
  renderRecords((await recRes.json()).records);
  renderKpis(await statRes.json());
  renderReport(await repRes.json());

  const me = await meRes.json();
  if (me.role === "admin") $("adminLink").classList.remove("hidden");
  else $("adminLink").classList.add("hidden");
}

function renderKpis(s){
  const box = $("kpis");
  if (!s || s.count === 0){
    box.innerHTML = `
      <div class="kpi"><div class="k-label">총 기록</div><div class="k-val">0</div></div>
      <div class="kpi"><div class="k-label">평균 체중</div><div class="k-val">—</div></div>
      <div class="kpi"><div class="k-label">평균 BMI</div><div class="k-val">—</div></div>`;
    return;
  }
  box.innerHTML = `
    <button class="kpi kpi-click" data-act="history"><div class="k-label">총 기록</div>
      <div class="k-val">${s.count}<span class="k-unit">건</span></div>
      <div class="k-hint">클릭 → 전체 기록 보기</div></button>
    <button class="kpi kpi-click" data-act="weight"><div class="k-label">평균 체중</div>
      <div class="k-val">${s.avg_weight}<span class="k-unit">kg</span></div>
      <div class="k-hint">클릭 → 체중 추이</div></button>
    <button class="kpi kpi-click" data-act="bmi"><div class="k-label">평균 BMI</div>
      <div class="k-val">${s.avg_bmi}</div>
      <div class="k-hint">클릭 → BMI 추이</div></button>`;
  box.querySelectorAll(".kpi-click").forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a === "history") openHistory();
    else openTrend(a);   // "weight" | "bmi"
  });
}

function renderReport(r){
  const box = $("report");
  if (!r || r.this_week_avg_weight === null){
    box.innerHTML = `<div class="trend-sub">최근 7일 기록이 없어요. 이번 주 기록을 추가하면 지난주와 비교해 드려요.</div>`;
    return;
  }
  let chip = `<span class="chip-change flat">—</span>`, sub = "지난주 기록이 없어 비교할 수 없어요.";
  if (r.change !== null){
    const cls = r.change < 0 ? "down" : (r.change > 0 ? "up" : "flat");
    const arrow = r.change < 0 ? "▼" : (r.change > 0 ? "▲" : "–");
    const sign = r.change > 0 ? "+" : "";
    chip = `<span class="chip-change ${cls}">${arrow} ${sign}${r.change} kg</span>`;
    sub = `지난주 평균 ${r.last_week_avg_weight} kg 대비`;
  }
  box.innerHTML = `
    <div class="trend"><span class="now">${r.this_week_avg_weight}<span class="k-unit">kg</span></span>${chip}</div>
    <div class="trend-sub">${sub} · 기준일 ${r.today}</div>`;
}

let recordsCache = [];
let selectedId = null;

function renderRecords(list){
  const side = $("dateList"), empty = $("emptyRows"), layout = $("logLayout");
  recordsCache = (list || []).slice().sort((a,b) => (a.date < b.date ? 1 : -1)); // 최신 위로
  if (recordsCache.length === 0){
    empty.classList.remove("hidden");
    layout.classList.add("hidden");
    return;
  }
  empty.classList.add("hidden");
  layout.classList.remove("hidden");
  side.innerHTML = recordsCache.map(r => {
    const warn = (r.warnings || []).length > 0;
    return `<button class="date-btn" data-id="${r.id}"><span class="d-dot ${warn?"warn":""}"></span>${r.date}</button>`;
  }).join("");
  side.querySelectorAll(".date-btn").forEach(b => {
    b.onclick = () => selectDay(parseInt(b.dataset.id));
  });
  // 이전 선택 유지, 없으면 최신 자동 선택
  const keep = recordsCache.find(r => r.id === selectedId);
  selectDay(keep ? selectedId : recordsCache[0].id);
}

function selectDay(id){
  selectedId = id;
  const r = recordsCache.find(x => x.id === id);
  document.querySelectorAll(".date-btn").forEach(b =>
    b.classList.toggle("active", parseInt(b.dataset.id) === id));
  if (!r){ $("dayDetail").innerHTML = `<div class="detail-empty">기록을 찾을 수 없어요.</div>`; return; }
  const chip = (c) => `<span class="chip ${statusClass(c)}">${c}</span>`;
  const warns = r.warnings || [];
  $("dayDetail").innerHTML = `
    <div class="detail-head"><span class="detail-date">${r.date}</span>${chip(r.bmi_category)}</div>
    <div class="detail-grid">
      <div class="dfield"><div class="df-label">체중</div><div class="df-val">${r.weight}<span class="df-unit">kg</span></div></div>
      <div class="dfield"><div class="df-label">키</div><div class="df-val">${r.height}<span class="df-unit">cm</span></div></div>
      <div class="dfield"><div class="df-label">BMI</div><div class="df-val">${r.bmi}</div></div>
      <div class="dfield"><div class="df-label">혈압</div><div class="df-val">${r.systolic}/${r.diastolic} ${chip(r.bp_category)}</div></div>
      <div class="dfield"><div class="df-label">공복혈당</div><div class="df-val">${r.blood_sugar}<span class="df-unit">mg/dL</span> ${chip(r.sugar_category)}</div></div>
      <div class="dfield"><div class="df-label">걸음 / 수면</div><div class="df-val">${r.steps}<span class="df-unit">보</span> · ${r.sleep_hours}<span class="df-unit">h</span></div></div>
    </div>
    ${warns.length ? `<div class="detail-warns">⚠ ${warns.join(", ")}</div>` : ""}
    <div class="detail-memo">
      <span class="dm-label">메모</span>
      <div class="memo-edit">
        <input id="memoInput" value="${(r.memo || "").replace(/"/g, "&quot;")}" placeholder="메모 입력…">
        <button class="btn-memo" id="memoSave">저장</button>
      </div>
    </div>
    <div class="detail-actions">
      <button class="btn-edit" id="editBtn">기록 값 수정</button>
      <button class="btn-del" data-id="${r.id}">이 기록 삭제</button>
    </div>`;
  $("dayDetail").querySelector(".btn-del").onclick = () => delRecord(r.id);
  $("editBtn").onclick = () => openEdit(r);
  $("memoSave").onclick = () => saveMemo(r);
}

function openEdit(r){
  const esc = (s) => (s || "").replace(/"/g, "&quot;");
  $("modalBody").innerHTML = `<h3 class="modal-title">${r.date} 기록 값 수정</h3>
    <form id="editForm" class="edit-grid">
      <label><span>체중 (kg)</span><input name="weight" type="number" step="0.1" value="${r.weight}" required></label>
      <label><span>키 (cm)</span><input name="height" type="number" step="0.1" value="${r.height}" required></label>
      <label><span>수축기 혈압</span><input name="systolic" type="number" value="${r.systolic}" required></label>
      <label><span>이완기 혈압</span><input name="diastolic" type="number" value="${r.diastolic}" required></label>
      <label><span>공복 혈당</span><input name="blood_sugar" type="number" value="${r.blood_sugar}" required></label>
      <label><span>걸음 수</span><input name="steps" type="number" value="${r.steps}"></label>
      <label><span>수면 (h)</span><input name="sleep_hours" type="number" step="0.1" value="${r.sleep_hours}"></label>
      <label class="ef-full"><span>메모</span><input name="memo" value="${esc(r.memo)}"></label>
      <button class="primary ef-full" type="submit">저장</button>
    </form>`;
  $("editForm").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const body = {
      date:r.date, weight:parseFloat(f.get("weight")), height:parseFloat(f.get("height")),
      systolic:parseInt(f.get("systolic")), diastolic:parseInt(f.get("diastolic")),
      blood_sugar:parseInt(f.get("blood_sugar")), steps:parseInt(f.get("steps"))||0,
      sleep_hours:parseFloat(f.get("sleep_hours"))||0, memo:f.get("memo")||"",
    };
    const res = await fetch("/records/" + r.id, {method:"PUT",
      headers:{"Content-Type":"application/json", ...authHead()}, body:JSON.stringify(body)});
    if (res.status === 401){ showAuth(); return; }
    closeUiModal(); loadAll();
  };
  $("uiModal").classList.remove("hidden");
}

async function saveMemo(r){
  const body = {
    date:r.date, weight:r.weight, height:r.height, systolic:r.systolic,
    diastolic:r.diastolic, blood_sugar:r.blood_sugar,
    steps:r.steps, sleep_hours:r.sleep_hours, memo:$("memoInput").value,
  };
  const btn = $("memoSave"); btn.textContent = "저장중…"; btn.disabled = true;
  const res = await fetch("/records/" + r.id, {method:"PUT",
    headers:{"Content-Type":"application/json", ...authHead()}, body:JSON.stringify(body)});
  if (res.status === 401){ showAuth(); return; }
  loadAll();   // 갱신 (선택 유지됨)
}

async function delRecord(id){
  if (!confirm("이 기록을 삭제할까요?")) return;
  const res = await fetch("/records/" + id, {method:"DELETE", headers:authHead()});
  if (res.status === 401){ showAuth(); return; }
  selectedId = null;
  loadAll();
}

$("recForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const body = {
    date:f.get("date"),
    weight:parseFloat(f.get("weight")),
    height:parseFloat(f.get("height")),
    systolic:parseInt(f.get("systolic")),
    diastolic:parseInt(f.get("diastolic")),
    blood_sugar:parseInt(f.get("blood_sugar")),
    steps: parseInt(f.get("steps")) || 0,
    sleep_hours: parseFloat(f.get("sleep_hours")) || 0,
    memo: f.get("memo") || "",
  };
  const res = await fetch("/records", {
    method:"POST",
    headers:{"Content-Type":"application/json", ...authHead()},
    body: JSON.stringify(body)
  });
  if (res.status === 401){ showAuth(); return; }
  e.target.reset();
  loadAll();
});

// ----- 그래프 / 히스토리 모달 -----
function lineChart(series, color){
  const clean = series.filter(s => s.value != null);
  if (!clean.length) return `<div class="detail-empty">데이터 없음</div>`;
  const W=620,H=210,pl=44,pr=14,pt=16,pb=28,n=clean.length;
  const vals=clean.map(s=>s.value);
  let mn=Math.min(...vals), mx=Math.max(...vals); if (mn===mx){ mn-=1; mx+=1; }
  const iw=W-pl-pr, ih=H-pt-pb;
  const X=i=> pl + (n===1? iw/2 : iw*i/(n-1));
  const Y=v=> pt + ih*(1-(v-mn)/(mx-mn));
  const pts=clean.map((s,i)=>`${X(i).toFixed(1)},${Y(s.value).toFixed(1)}`).join(" ");
  const area=`${pl},${(pt+ih).toFixed(1)} ${pts} ${X(n-1).toFixed(1)},${(pt+ih).toFixed(1)}`;
  const step=Math.max(1, Math.ceil(n/8));
  const dots = n<=45 ? clean.map((s,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(s.value).toFixed(1)}" r="2.5" fill="${color}"/>`).join("") : "";
  const xlab = clean.map((s,i)=> (i%step===0||i===n-1) ? `<text x="${X(i).toFixed(1)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${s.label}</text>` : "").join("");
  const ylab = `<text x="6" y="${(Y(mx)+3).toFixed(1)}" font-size="10" fill="var(--muted)">${mx}</text>`+
               `<text x="6" y="${(Y(mn)+3).toFixed(1)}" font-size="10" fill="var(--muted)">${mn}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block">
    <polygon points="${area}" fill="${color}" opacity="0.08"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>${dots}${xlab}${ylab}</svg>`;
}

function openTrend(metric){
  const asc = recordsCache.slice().sort((a,b)=> a.date < b.date ? -1 : 1);   // 오래된 → 최신
  const pts = asc.map(r => ({label:r.date.slice(5), value: metric==="weight" ? r.weight : r.bmi}));
  const title = metric==="weight" ? "체중 추이 (kg)" : "BMI 추이";
  $("modalBody").innerHTML = `<h3 class="modal-title">${title}</h3>${lineChart(pts, "var(--brand)")}
    <p class="detail-empty" style="text-align:left;padding:8px 0 0">${asc.length}개 기록 · ${asc[0]?.date} ~ ${asc[asc.length-1]?.date}</p>`;
  $("uiModal").classList.remove("hidden");
}

function openHistory(){
  const chip = (c) => `<span class="chip ${statusClass(c)}">${c}</span>`;
  const rows = recordsCache.map(r =>
    `<tr><td class="num">${r.date}</td><td class="num">${r.weight}</td><td class="num">${r.bmi}</td>`+
    `<td>${chip(r.bmi_category)}</td><td class="num">${r.systolic}/${r.diastolic}</td><td class="num">${r.blood_sugar}</td>`+
    `<td>${r.memo || "—"}</td></tr>`).join("") || `<tr><td colspan="7" class="detail-empty">기록 없음</td></tr>`;
  $("modalBody").innerHTML = `<h3 class="modal-title">전체 기록 (${recordsCache.length}건)</h3>
    <div class="tbl-scroll"><table class="hist">
      <thead><tr><th>날짜</th><th>체중</th><th>BMI</th><th>체형</th><th>혈압</th><th>혈당</th><th>메모</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  $("uiModal").classList.remove("hidden");
}

function closeUiModal(){ $("uiModal").classList.add("hidden"); }
$("uiModalClose").onclick = closeUiModal;
$("uiModal").onclick = (e) => { if (e.target === $("uiModal")) closeUiModal(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeUiModal(); });

// 새 기록 날짜 기본값 = 오늘
(function(){ const el = document.querySelector('[name=date]'); if (el) el.value = new Date().toISOString().slice(0,10); })();

// 시작
if (token()) showApp(localStorage.getItem("name") || ""); else showAuth();
</script>
