<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이 헬스 로그</title>
<style>
  :root{
    --bg:#eef2f5; --card:#ffffff; --ink:#16232e; --muted:#64748b;
    --line:#e2e8f0; --field:#f8fafc;
    --brand:#0f766e; --brand-ink:#0b5a54; --brand-soft:#d5ece9;
    --ok:#15803d; --ok-dot:#22c55e; --ok-bg:#e7f6ec;
    --warn:#b45309; --warn-dot:#f59e0b; --warn-bg:#fdf2e3;
    --bad:#b91c1c; --bad-dot:#ef4444; --bad-bg:#fdeaea;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Consolas",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    --radius:14px; --shadow:0 1px 2px rgba(16,35,46,.06),0 8px 24px rgba(16,35,46,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1317; --card:#161d23; --ink:#e6edf3; --muted:#8b98a5;
      --line:#26303a; --field:#0f161b;
      --brand:#2dd4bf; --brand-ink:#5eead4;
      --ok:#4ade80; --ok-dot:#22c55e; --ok-bg:#13251a;
      --warn:#fbbf24; --warn-dot:#f59e0b; --warn-bg:#2a2011;
      --bad:#f87171; --bad-dot:#ef4444; --bad-bg:#2a1516;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 64px}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;
    padding:6px 2px 20px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
  .pulse{width:26px;height:26px;flex:none}
  .pulse path{stroke:var(--brand);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .who{font-size:13px;color:var(--muted)}
  .who b{color:var(--ink)}
  .ghost{background:none;border:1px solid var(--line);color:var(--muted);
    padding:6px 12px;border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit}
  .ghost:hover{color:var(--ink);border-color:var(--muted)}

  /* auth */
  .auth{max-width:380px;margin:6vh auto 0;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 24px}
  .auth h1{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
  .auth p{margin:0 0 20px;color:var(--muted);font-size:14px}
  .auth .row{display:flex;gap:8px;margin-top:16px}
  .auth .row button{flex:1}

  label{display:block;font-size:12px;color:var(--muted);margin-bottom:14px;font-weight:500}
  label span{display:block;margin-bottom:5px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--field);color:var(--ink);font-size:15px;font-family:inherit}
  input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}

  button.primary{background:var(--brand);color:#fff;border:none;padding:11px 16px;
    border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  button.primary:hover{background:var(--brand-ink)}
  button.line{background:var(--card);color:var(--brand);border:1px solid var(--brand);
    padding:11px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}

  .msg{font-size:13px;min-height:18px;margin-top:12px}
  .msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}

  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    margin:0 0 14px;font-weight:600}

  /* KPI readouts */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px}
  .kpi .k-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
    display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
  .kpi .k-val{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.02em;
    margin-top:8px;font-variant-numeric:tabular-nums}
  .kpi .k-unit{font-size:13px;color:var(--muted);font-family:var(--sans);margin-left:3px}
  .kpi .k-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .kpi-click{cursor:pointer;font:inherit;text-align:left;width:100%}
  .kpi-click:hover{border-color:var(--brand)}
  .k-hint{font-size:11px;color:var(--brand);margin-top:6px}
  .memo-edit{display:flex;gap:8px;margin-top:4px}
  .memo-edit input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font-family:inherit;font-size:14px}
  .btn-memo{background:var(--brand);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
  .btn-memo:hover{background:var(--brand-ink)}
  .modal-overlay{position:fixed;inset:0;background:rgba(10,15,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;z-index:100}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.35);max-width:680px;width:100%;padding:26px;position:relative}
  .modal-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;line-height:1}
  .modal-close:hover{color:var(--ink)}
  .modal-title{font-size:16px;margin:0 0 14px}
  .detail-actions{display:flex;gap:8px;margin-top:18px;align-items:center}
  .detail-actions .btn-del{margin-top:0}
  .btn-edit{background:none;border:1px solid var(--brand);color:var(--brand);padding:8px 14px;border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit}
  .btn-edit:hover{background:var(--brand-soft)}
  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .edit-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .edit-grid input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font-family:inherit;font-size:14px}
  .edit-grid .ef-full{grid-column:1/-1}
  .dp-pop{position:fixed;z-index:200;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:10px;width:236px}
  .dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .dp-head b{font-size:13px}
  .dp-nav{background:none;border:none;font-size:16px;color:var(--muted);cursor:pointer;padding:2px 9px;border-radius:6px}
  .dp-nav:hover{background:var(--field);color:var(--ink)}
  .dp-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
  .dp-dows span{text-align:center;font-size:10px;color:var(--muted)}
  .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .dp-grid span{height:30px}
  .dp-day{height:30px;border:none;background:none;border-radius:7px;font-size:12px;color:var(--ink);cursor:pointer;font-family:inherit;font-variant-numeric:tabular-nums}
  .dp-day:hover{background:var(--field)}
  .dp-day.sel{background:var(--brand);color:#fff}
  .hist-toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .dp-in{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font-family:inherit;font-size:13px}
  .btn-mini{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit}
  .btn-mini:hover{color:var(--ink);border-color:var(--muted)}
  tr.month-sep td{background:var(--field);font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:600}
  .tips{display:flex;flex-direction:column;gap:10px}
  .tip{border-left:3px solid var(--brand);background:var(--field);border-radius:0 10px 10px 0;padding:10px 12px}
  .tip-t{font-weight:700;font-size:14px}
  .tip-d{font-size:13px;color:var(--ink);margin-top:2px}
  .tip-f{font-size:12px;color:var(--brand-ink);margin-top:5px}
  table.hist{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
  table.hist th,table.hist td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  table.hist th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  table.hist td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* weekly trend */
  .trend{display:flex;align-items:baseline;gap:12px}
  .trend .now{font-family:var(--mono);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
  .chip-change{font-family:var(--mono);font-size:15px;font-weight:600;padding:3px 9px;border-radius:8px;
    font-variant-numeric:tabular-nums}
  .chip-change.down{color:var(--ok);background:var(--ok-bg)}
  .chip-change.up{color:var(--bad);background:var(--bad-bg)}
  .chip-change.flat{color:var(--muted);background:var(--field)}
  .trend-sub{font-size:13px;color:var(--muted);margin-top:8px}

  /* form */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .grid .full{grid-column:1/-1}

  /* table */
  .tbl-scroll{overflow-x:auto;margin:0 -18px -18px;padding:0 18px}
  /* 환자 AI 소견 */
  .ai-head{display:flex;align-items:center;justify-content:space-between}
  .ai-src{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
  .ai-src.gpt{background:rgba(91,141,239,.15);color:#5b8def}
  .ai-src.mock{background:rgba(140,150,160,.15);color:#7b8794}
  .ai-narr{font-size:14px;line-height:1.7;margin:8px 0 12px}
  .ai-risk{display:flex;align-items:baseline;gap:10px;margin-top:6px}
  .ai-risk-pct{font-size:30px;font-weight:800;line-height:1}
  .ai-risk-meta{font-size:13px;color:#7b8794}
  .ai-bar{height:7px;border-radius:6px;background:rgba(140,150,160,.18);margin:8px 0 4px;overflow:hidden}
  .ai-bar-fill{height:100%;border-radius:6px;transition:width .4s}
  .ai-drivers{font-size:12.5px;color:#7b8794;margin-top:6px}
  .ai-foot{font-size:11.5px;color:#7b8794;margin:8px 0 0}
  .mini-title{font-size:12.5px;color:#7b8794;font-weight:600;margin-bottom:2px}
  .num{text-align:right}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
  th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500}
  .chip.s-ok{color:var(--ok);background:var(--ok-bg)}
  .chip.s-warn{color:var(--warn);background:var(--warn-bg)}
  .chip.s-bad{color:var(--bad);background:var(--bad-bg)}
  .warns{color:var(--bad);font-size:12px}

  .empty{text-align:center;color:var(--muted);font-size:14px;padding:28px 0}

  /* 날짜 사이드바 + 상세 */
  .log-layout{display:grid;grid-template-columns:170px 1fr;gap:16px}
  .log-side{display:flex;flex-direction:column;gap:3px;max-height:440px;overflow-y:auto;
    border-right:1px solid var(--line);padding-right:12px}
  .date-btn{display:flex;align-items:center;gap:8px;text-align:left;background:none;border:none;
    padding:9px 10px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--ink);
    font-variant-numeric:tabular-nums}
  .date-btn:hover{background:var(--field)}
  .date-btn.active{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
  .date-btn .d-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok-dot)}
  .date-btn .d-dot.warn{background:var(--bad-dot)}
  .log-detail{min-height:200px}
  .detail-empty{color:var(--muted);font-size:14px;padding:24px 0;text-align:center}
  .detail-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
  .detail-date{font-family:var(--mono);font-size:22px;font-weight:600}
  .detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px}
  .dfield .df-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .dfield .df-val{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums;margin-top:2px}
  .dfield .df-val .df-unit{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:3px}
  .detail-warns{margin-top:16px;padding:12px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-size:13px}
  .detail-memo{margin-top:14px;font-size:14px}
  .detail-memo .dm-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:3px}
  .btn-del{margin-top:18px;background:none;border:1px solid var(--line);color:var(--bad);
    padding:8px 14px;border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit}
  .btn-del:hover{background:var(--bad-bg);border-color:var(--bad)}
  @media(max-width:560px){
    .log-layout{grid-template-columns:1fr}
    .log-side{flex-direction:row;overflow-x:auto;max-height:none;border-right:none;
      border-bottom:1px solid var(--line);padding:0 0 10px}
    .date-btn{white-space:nowrap}
  }
  .admin-link{display:flex;flex-direction:column;gap:3px;text-decoration:none;color:var(--ink);
    background:var(--card);border:1px solid var(--brand);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
  .admin-link:hover{background:var(--field)}
  .admin-link span:first-child{font-weight:700;font-size:15px}
  .admin-link .arrow{font-size:12px;color:var(--brand);font-weight:600}
  h3.sub{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:22px 0 8px;font-weight:600}
  .role-badge{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:6px;
    background:var(--field);color:var(--muted)}
  .role-badge.admin{background:var(--brand);color:#fff}
  td.act{font-family:var(--mono);font-size:12px}
  .hidden{display:none}
  @media (max-width:560px){
    .kpis{grid-template-columns:1fr}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <svg class="pulse" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M2 17 h6 l3 -9 l5 17 l3 -8 h11"/>
      </svg>
      마이 헬스 로그
    </div>
    <div id="userArea" class="hidden">
      <span class="who"><b id="who"></b>님</span>
      <button class="ghost" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <!-- 로그인/회원가입 -->
  <section class="auth" id="authView">
    <h1>건강 기록 시작하기</h1>
    <p>매일의 수치를 기록하면 BMI·혈압·혈당 상태를 자동으로 분석해 드려요.</p>
    <label><span>아이디</span><input id="au" autocomplete="username"></label>
    <label><span>비밀번호</span><input id="ap" type="password" autocomplete="current-password"></label>
    <div class="row">
      <button class="primary" id="loginBtn">로그인</button>
      <button class="line" id="signupBtn">회원가입</button>
    </div>
    <div class="msg" id="authMsg"></div>
  </section>

  <!-- 앱 -->
  <main class="hidden" id="appView">

    <!-- 검진 환자용 뷰 (코호트 유저) -->
    <div id="patientView" class="hidden"></div>

    <div class="kpis" id="kpis"><!-- JS로 채움 --></div>

    <section class="card">
      <h2>주간 리포트 · 평균 체중</h2>
      <div id="report"></div>
    </section>

    <section class="card">
      <h2>오늘의 건강 조언</h2>
      <div class="tips" id="advice"></div>
    </section>

    <section class="card">
      <h2>새 기록</h2>
      <form id="recForm">
        <div class="grid">
          <label class="full"><span>날짜</span><input name="date" type="text" placeholder="날짜 선택" readonly required></label>
          <label><span>몸무게 (kg)</span><input name="weight" type="number" step="0.1" required></label>
          <label><span>키 (cm)</span><input name="height" type="number" step="0.1" required></label>
          <label><span>수축기 혈압</span><input name="systolic" type="number" required></label>
          <label><span>이완기 혈압</span><input name="diastolic" type="number" required></label>
          <label><span>공복 혈당 (mg/dL)</span><input name="blood_sugar" type="number" required></label>
          <label><span>걸음 수 (선택)</span><input name="steps" type="number" min="0"></label>
          <label><span>수면 시간 (선택)</span><input name="sleep_hours" type="number" step="0.1" min="0"></label>
          <label class="full"><span>메모 (선택)</span><input name="memo" type="text" placeholder="오늘 컨디션, 특이사항 등"></label>
        </div>
        <button class="primary" type="submit" style="width:100%">기록 추가</button>
      </form>
    </section>

    <section class="card">
      <h2>내 기록</h2>
      <div class="empty hidden" id="emptyRows">아직 기록이 없어요. 위에서 첫 기록을 추가해 보세요.</div>
      <div class="log-layout hidden" id="logLayout">
        <aside class="log-side" id="dateList"></aside>
        <div class="log-detail" id="dayDetail">
          <div class="detail-empty">왼쪽에서 날짜를 선택하면 그날 기록을 볼 수 있어요.</div>
        </div>
      </div>
    </section>

    <!-- 관리자만 보이는 대시보드 링크 -->
    <a class="admin-link hidden" id="adminLink" href="/dashboard">
      <span>관리자 대시보드</span>
      <span class="arrow">전체 사용자 · 활동 로그 · 통계 보기 →</span>
    </a>

  </main>

  <!-- 그래프/기록 팝업 -->
  <div class="modal-overlay hidden" id="uiModal">
    <div class="modal">
      <button class="modal-close" id="uiModalClose" aria-label="닫기">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const token = () => localStorage.getItem("token");
const authHead = () => ({ "Authorization": "Bearer " + token() });

function statusClass(cat){
  if (cat === "정상") return "s-ok";
  if (["비만","고혈압","당뇨 의심"].includes(cat)) return "s-bad";
  return "s-warn"; // 저체중·과체중·주의·공복혈당장애
}

function showApp(name){
  $("authView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  $("userArea").classList.remove("hidden");
  $("who").textContent = name;
  loadAll();
}
function showAuth(){
  $("appView").classList.add("hidden");
  $("userArea").classList.add("hidden");
  $("authView").classList.remove("hidden");
}

// 회원가입
$("signupBtn").onclick = async () => {
  const m = $("authMsg"); m.className = "msg"; m.textContent = "";
  const res = await fetch("/signup", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({username:$("au").value, password:$("ap").value})
  });
  if (res.ok){ m.className="msg ok"; m.textContent="가입 완료! 이제 로그인하세요."; }
  else { const e = await res.json(); m.className="msg err"; m.textContent = e.detail || "가입 실패"; }
};

// 로그인
$("loginBtn").onclick = async () => {
  const m = $("authMsg"); m.className="msg"; m.textContent="";
  const body = new URLSearchParams({username:$("au").value, password:$("ap").value});
  const res = await fetch("/login", { method:"POST", body });
  if (res.ok){
    const d = await res.json();
    localStorage.setItem("token", d.access_token);
    localStorage.setItem("name", $("au").value);
    showApp($("au").value);
  } else { const e = await res.json(); m.className="msg err"; m.textContent = e.detail || "로그인 실패"; }
};

$("logoutBtn").onclick = () => {
  localStorage.removeItem("token"); localStorage.removeItem("name"); showAuth();
};

async function loadAll(){
  const meRes = await fetch("/me", {headers:authHead()});
  if (meRes.status === 401){ showAuth(); return; }
  const me = await meRes.json();
  if (me.is_patient){ return renderPatientView(me); }   // 코호트 검진 유저

  const [recRes, statRes, repRes] = await Promise.all([
    fetch("/records", {headers:authHead()}),
    fetch("/stats", {headers:authHead()}),
    fetch("/report/weekly", {headers:authHead()}),
  ]);
  if (recRes.status === 401){ showAuth(); return; }
  renderRecords((await recRes.json()).records);
  renderKpis();
  renderAdvice();
  await statRes.json();
  renderReport(await repRes.json());

  if (me.role === "admin" || me.role === "superadmin") $("adminLink").classList.remove("hidden");
  else $("adminLink").classList.add("hidden");
}

const GKO_P = {0:"정상", 1:"주의", 2:"위험"};
const gcol_p = (g)=> g===2 ? "var(--bad,#d9534f)" : g===1 ? "#e8a33d" : "var(--ok,#3a9d5d)";

async function renderPatientView(me){
  // 일반 유저용 섹션 숨기고 검진 뷰만 표시
  document.querySelectorAll("#appView > .card, #appView > .kpis, #appView > .admin-link")
    .forEach(el => el.classList.add("hidden"));
  const pv = $("patientView"); pv.classList.remove("hidden");
  $("who").textContent = me.name || me.username;
  pv.innerHTML = `<div class="muted-dash" style="padding:20px 0">불러오는 중…</div>`;

  const [ckRes, aiRes, recRes] = await Promise.all([
    fetch("/my/checkups", {headers:authHead()}),
    fetch("/my/ai-insight", {headers:authHead()}),
    fetch("/records", {headers:authHead()}),
  ]);
  const cks = (await ckRes.json()).checkups || [];
  const ai = aiRes.ok ? await aiRes.json() : null;
  const myRecords = recRes.ok ? ((await recRes.json()).records || []) : [];

  const last = cks.length ? cks[cks.length-1] : null;
  const who = `${me.age??"?"}세 · ${me.sex==="M"?"남성":"여성"} · ${me.smoker?"흡연":"비흡연"}`;
  const chip = (label,g)=>`<span class="chip" style="background:${gcol_p(g)}22;color:${gcol_p(g)};border:1px solid ${gcol_p(g)}55">${label}</span>`;

  // KPI
  const bmiG = last.bmi>=25?2:last.bmi>=23?1:0;
  const bpG  = (last.systolic>=140||last.diastolic>=90)?2:(last.systolic>=120||last.diastolic>=80)?1:0;
  const fbsG = last.fbs>=126?2:last.fbs>=100?1:0;
  const kpis = `<div class="kpis">
    <div class="kpi"><div class="k-label">종합판정</div><div class="k-val" style="color:${gcol_p(last.grade)}">${GKO_P[last.grade]}</div><div class="k-sub">최근 검진 ${last.date}</div></div>
    <div class="kpi"><div class="k-label">BMI</div><div class="k-val">${last.bmi}</div><div class="k-sub">${chip(bmiG===2?"비만":bmiG===1?"과체중":"정상",bmiG)}</div></div>
    <div class="kpi"><div class="k-label">혈압</div><div class="k-val">${last.systolic}<span class="k-unit">/${last.diastolic}</span></div><div class="k-sub">${chip(bpG===2?"고혈압":bpG===1?"주의":"정상",bpG)}</div></div>
    <div class="kpi"><div class="k-label">공복혈당</div><div class="k-val">${last.fbs}<span class="k-unit">mg/dL</span></div><div class="k-sub">${chip(fbsG===2?"당뇨의심":fbsG===1?"경계":"정상",fbsG)}</div></div>
  </div>`;

  // AI 소견
  let aiHtml = "";
  if (ai){
    const r = ai.data.risk||{}, eff=(ai.data.insights&&ai.data.insights.effects)||[];
    let rl = "";
    if (r.available && r.eligible && r.prob!=null){
      const pct=(r.prob*100).toFixed(0), base=((r.baseline||0)*100).toFixed(0);
      const lvl=r.prob>=(r.baseline*2)?"높음":r.prob>=r.baseline?"보통":"낮음";
      const col=lvl==="높음"?"var(--bad,#d9534f)":lvl==="보통"?"#e8a33d":"var(--ok,#3a9d5d)";
      const w=Math.min(100,r.prob*100).toFixed(0);
      rl=`<div class="ai-risk"><span class="ai-risk-pct" style="color:${col}">${pct}%</span>
        <span class="ai-risk-meta">다음 검진에 위험군 전환 확률 · 평균 ${base}% 대비 <b style="color:${col}">${lvl}</b></span></div>
        <div class="ai-bar"><div class="ai-bar-fill" style="width:${w}%;background:${col}"></div></div>`;
      if ((r.drivers||[]).length) rl+=`<div class="ai-drivers">주요 요인: ${r.drivers.map(x=>x.feature).join(" · ")}</div>`;
    } else if (r.available && !r.eligible){
      rl=`<div class="ai-risk-meta">현재 위험군입니다. 정기적인 진료와 관리가 필요합니다.</div>`;
    }
    const sig=eff.filter(e=>e.verdict==="유의");
    const rows=sig.map(e=>`<tr><td>${e.tag}</td><td>${e.metric_ko}</td>
      <td class="num" style="color:${e.direction==="감소"?"var(--ok,#3a9d5d)":"var(--bad,#d9534f)"};font-weight:600">${e.delta>0?"+":""}${e.delta}</td>
      <td class="num">${e.n}</td><td class="num">${e.p_adj}</td></tr>`).join("");
    aiHtml=`<section class="card">
      <div class="ai-head"><h2 style="margin:0">AI 건강 소견</h2><span class="ai-src ${ai.narrative.source}">${ai.narrative.source==="gpt"?"GPT":"규칙기반"}</span></div>
      <p class="ai-narr">${ai.narrative.text}</p>
      ${rl}
      ${rows?`<div class="tbl-scroll" style="margin-top:12px"><table>
        <thead><tr><th>생활습관</th><th>지표</th><th>변화</th><th>횟수</th><th>보정p</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
        <p class="ai-foot">통계적으로 유의한(다중보정 후) 습관–지표 연관만 표시</p>`:
        `<p class="ai-foot">아직 뚜렷한 생활습관–지표 연관은 관찰되지 않았어요.</p>`}
    </section>`;
  }

  // 추이 차트
  const asc = cks.slice().sort((a,b)=>a.quarter-b.quarter);
  const trend=`<section class="card"><h2>검진 추이</h2>
    <div class="mini-title">수축기 혈압</div>${lineChart(asc.map(c=>({label:"Q"+c.quarter,value:c.systolic})),"#d9534f",[{y:140,color:"#d9534f",label:"고혈압"},{y:120,color:"#e8a33d",label:"주의"}])}
    <div class="mini-title" style="margin-top:12px">공복혈당</div>${lineChart(asc.map(c=>({label:"Q"+c.quarter,value:c.fbs})),"#e8a33d",[{y:126,color:"#d9534f",label:"당뇨"},{y:100,color:"#e8a33d",label:"경계"}])}
    <div class="mini-title" style="margin-top:12px">체질량지수(BMI)</div>${lineChart(asc.map(c=>({label:"Q"+c.quarter,value:c.bmi})),"#5b8def",[{y:25,color:"#d9534f",label:"비만"},{y:23,color:"#e8a33d",label:"과체중"}])}
  </section>`;

  // 검진 이력
  const hist = cks.slice().sort((a,b)=>b.quarter-a.quarter).map(c=>
    `<tr><td class="num">Q${c.quarter}</td><td class="num">${c.date}</td><td class="num">${c.bmi}</td>
     <td class="num">${c.systolic}/${c.diastolic}</td><td class="num">${c.fbs}</td>
     <td><span style="color:${gcol_p(c.grade)};font-weight:600">${GKO_P[c.grade]}</span></td>
     <td>${c.memo||"—"}</td></tr>`).join("");
  const table = cks.length ? `<section class="card"><h2>병원 검진 이력 (분기별)</h2>
    <div class="tbl-scroll" style="max-height:360px;overflow:auto"><table>
    <thead><tr><th>분기</th><th>검진일</th><th>BMI</th><th>혈압</th><th>혈당</th><th>판정</th><th>메모</th></tr></thead>
    <tbody>${hist}</tbody></table></div></section>` : "";

  // 일일 기록 입력폼 (본인이 직접 입력 → BMI 자동계산·분류)
  const today = new Date().toISOString().slice(0,10);
  const dailyForm = `<section class="card"><h2>오늘 기록 입력</h2>
    <form id="pDaily">
      <div class="grid">
        <label class="full"><span>날짜</span><input name="date" type="text" value="${today}" readonly required></label>
        <label><span>몸무게 (kg)</span><input name="weight" type="number" step="0.1" required></label>
        <label><span>키 (cm)</span><input name="height" type="number" step="0.1" required></label>
        <label><span>수축기 혈압</span><input name="systolic" type="number" required></label>
        <label><span>이완기 혈압</span><input name="diastolic" type="number" required></label>
        <label><span>공복 혈당 (mg/dL)</span><input name="blood_sugar" type="number" required></label>
        <label class="full"><span>메모 (선택)</span><input name="memo" type="text" placeholder="오늘 컨디션·생활습관"></label>
      </div>
      <button class="primary" type="submit" style="width:100%">기록 추가</button>
      <div id="pDailyMsg" class="msg"></div>
    </form></section>`;

  // 내 일일 기록 목록 (BMI·분류·경고 자동계산됨)
  const dailyRows = myRecords.slice().sort((a,b)=> a.date<b.date?1:-1).map(r=>{
    const cc=(c)=>`<span class="chip ${statusClass(c)}">${c}</span>`;
    return `<tr><td class="num">${r.date}</td><td class="num">${r.weight}</td>
      <td class="num">${r.bmi} ${cc(r.bmi_category)}</td>
      <td class="num">${r.systolic}/${r.diastolic} ${cc(r.bp_category)}</td>
      <td class="num">${r.blood_sugar} ${cc(r.sugar_category)}</td>
      <td>${(r.warnings||[]).join(", ")||"—"}</td><td>${r.memo||"—"}</td></tr>`;}).join("");
  const dailyList = myRecords.length ? `<section class="card"><h2>내 일일 기록 (${myRecords.length}건)</h2>
    <div class="tbl-scroll" style="max-height:320px;overflow:auto"><table>
    <thead><tr><th>날짜</th><th>체중</th><th>BMI</th><th>혈압</th><th>혈당</th><th>경고</th><th>메모</th></tr></thead>
    <tbody>${dailyRows}</tbody></table></div></section>` : "";

  pv.innerHTML = kpis + aiHtml + dailyForm + dailyList + trend + table;

  // 입력폼 제출 → POST /records → 화면 갱신
  $("pDaily").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const f = e.target, msg = $("pDailyMsg"); msg.className="msg"; msg.textContent="";
    const body = { date:f.date.value, weight:+f.weight.value, height:+f.height.value,
      systolic:+f.systolic.value, diastolic:+f.diastolic.value,
      blood_sugar:+f.blood_sugar.value, memo:f.memo.value };
    const res = await fetch("/records", {method:"POST",
      headers:{"Content-Type":"application/json", ...authHead()}, body:JSON.stringify(body)});
    if (res.ok){ renderPatientView(me); }         // 성공 → 목록 갱신
    else {
      let d; try{ d=await res.json(); }catch{ d={}; }
      const detail = Array.isArray(d.detail) ? d.detail[0]?.msg : d.detail;
      msg.className="msg err"; msg.textContent = detail || "입력값을 확인하세요 (범위 초과 등)";
    }
  });
}

function renderKpis(){
  const box = $("kpis");
  if (!recordsCache.length){
    box.innerHTML = `
      <div class="kpi"><div class="k-label">총 기록</div><div class="k-val">0</div></div>
      <div class="kpi"><div class="k-label">최근 체중</div><div class="k-val">—</div></div>
      <div class="kpi"><div class="k-label">최근 혈압</div><div class="k-val">—</div></div>
      <div class="kpi"><div class="k-label">최근 혈당</div><div class="k-val">—</div></div>`;
    return;
  }
  const r = recordsCache[0];   // 최신 기록
  const chip = (c) => `<span class="chip ${statusClass(c)}">${c}</span>`;
  box.innerHTML = `
    <button class="kpi kpi-click" data-act="history"><div class="k-label">총 기록</div>
      <div class="k-val">${recordsCache.length}<span class="k-unit">건</span></div>
      <div class="k-hint">클릭 → 전체 기록</div></button>
    <button class="kpi kpi-click" data-act="weight"><div class="k-label">최근 체중</div>
      <div class="k-val">${r.weight}<span class="k-unit">kg</span></div>
      <div class="k-sub">BMI ${r.bmi} ${chip(r.bmi_category)}</div></button>
    <button class="kpi kpi-click" data-act="bp"><div class="k-label">최근 혈압</div>
      <div class="k-val">${r.systolic}<span class="k-unit">/${r.diastolic}</span></div>
      <div class="k-sub">${chip(r.bp_category)}</div></button>
    <button class="kpi kpi-click" data-act="sugar"><div class="k-label">최근 혈당</div>
      <div class="k-val">${r.blood_sugar}<span class="k-unit">mg/dL</span></div>
      <div class="k-sub">${chip(r.sugar_category)}</div></button>`;
  box.querySelectorAll(".kpi-click").forEach(b => b.onclick = () => {
    const a = b.dataset.act;
    if (a === "history") openHistory();
    else openTrend(a);   // weight | bp | sugar
  });
}

function renderReport(r){
  const box = $("report");
  if (!r || r.this_week_avg_weight === null){
    box.innerHTML = `<div class="trend-sub">최근 7일 기록이 없어요. 이번 주 기록을 추가하면 지난주와 비교해 드려요.</div>`;
    return;
  }
  let chip = `<span class="chip-change flat">—</span>`, sub = "지난주 기록이 없어 비교할 수 없어요.";
  if (r.change !== null){
    const cls = r.change < 0 ? "down" : (r.change > 0 ? "up" : "flat");
    const arrow = r.change < 0 ? "▼" : (r.change > 0 ? "▲" : "–");
    const sign = r.change > 0 ? "+" : "";
    chip = `<span class="chip-change ${cls}">${arrow} ${sign}${r.change} kg</span>`;
    sub = `지난주 평균 ${r.last_week_avg_weight} kg 대비`;
  }
  box.innerHTML = `
    <div class="trend"><span class="now">${r.this_week_avg_weight}<span class="k-unit">kg</span></span>${chip}</div>
    <div class="trend-sub">${sub} · 기준일 ${r.today}</div>`;
}

let recordsCache = [];
let selectedId = null;

function renderRecords(list){
  const side = $("dateList"), empty = $("emptyRows"), layout = $("logLayout");
  recordsCache = (list || []).slice().sort((a,b) => (a.date < b.date ? 1 : -1)); // 최신 위로
  if (recordsCache.length === 0){
    empty.classList.remove("hidden");
    layout.classList.add("hidden");
    return;
  }
  empty.classList.add("hidden");
  layout.classList.remove("hidden");
  side.innerHTML = recordsCache.map(r => {
    const warn = (r.warnings || []).length > 0;
    return `<button class="date-btn" data-id="${r.id}"><span class="d-dot ${warn?"warn":""}"></span>${r.date}</button>`;
  }).join("");
  side.querySelectorAll(".date-btn").forEach(b => {
    b.onclick = () => selectDay(parseInt(b.dataset.id));
  });
  // 이전 선택 유지, 없으면 최신 자동 선택
  const keep = recordsCache.find(r => r.id === selectedId);
  selectDay(keep ? selectedId : recordsCache[0].id);
}

function selectDay(id){
  selectedId = id;
  const r = recordsCache.find(x => x.id === id);
  document.querySelectorAll(".date-btn").forEach(b =>
    b.classList.toggle("active", parseInt(b.dataset.id) === id));
  if (!r){ $("dayDetail").innerHTML = `<div class="detail-empty">기록을 찾을 수 없어요.</div>`; return; }
  const chip = (c) => `<span class="chip ${statusClass(c)}">${c}</span>`;
  const warns = r.warnings || [];
  $("dayDetail").innerHTML = `
    <div class="detail-head"><span class="detail-date">${r.date}</span>${chip(r.bmi_category)}</div>
    <div class="detail-grid">
      <div class="dfield"><div class="df-label">체중</div><div class="df-val">${r.weight}<span class="df-unit">kg</span></div></div>
      <div class="dfield"><div class="df-label">키</div><div class="df-val">${r.height}<span class="df-unit">cm</span></div></div>
      <div class="dfield"><div class="df-label">BMI</div><div class="df-val">${r.bmi}</div></div>
      <div class="dfield"><div class="df-label">혈압</div><div class="df-val">${r.systolic}/${r.diastolic} ${chip(r.bp_category)}</div></div>
      <div class="dfield"><div class="df-label">공복혈당</div><div class="df-val">${r.blood_sugar}<span class="df-unit">mg/dL</span> ${chip(r.sugar_category)}</div></div>
      <div class="dfield"><div class="df-label">걸음 / 수면</div><div class="df-val">${r.steps}<span class="df-unit">보</span> · ${r.sleep_hours}<span class="df-unit">h</span></div></div>
    </div>
    ${warns.length ? `<div class="detail-warns">⚠ ${warns.join(", ")}</div>` : ""}
    <div class="detail-memo">
      <span class="dm-label">메모</span>
      <div class="memo-edit">
        <input id="memoInput" value="${(r.memo || "").replace(/"/g, "&quot;")}" placeholder="메모 입력…">
        <button class="btn-memo" id="memoSave">저장</button>
      </div>
    </div>
    <div class="detail-actions">
      <button class="btn-edit" id="editBtn">기록 값 수정</button>
      <button class="btn-del" data-id="${r.id}">이 기록 삭제</button>
    </div>`;
  $("dayDetail").querySelector(".btn-del").onclick = () => delRecord(r.id);
  $("editBtn").onclick = () => openEdit(r);
  $("memoSave").onclick = () => saveMemo(r);
}

function openEdit(r){
  const esc = (s) => (s || "").replace(/"/g, "&quot;");
  $("modalBody").innerHTML = `<h3 class="modal-title">${r.date} 기록 값 수정</h3>
    <form id="editForm" class="edit-grid">
      <label><span>체중 (kg)</span><input name="weight" type="number" step="0.1" value="${r.weight}" required></label>
      <label><span>키 (cm)</span><input name="height" type="number" step="0.1" value="${r.height}" required></label>
      <label><span>수축기 혈압</span><input name="systolic" type="number" value="${r.systolic}" required></label>
      <label><span>이완기 혈압</span><input name="diastolic" type="number" value="${r.diastolic}" required></label>
      <label><span>공복 혈당</span><input name="blood_sugar" type="number" value="${r.blood_sugar}" required></label>
      <label><span>걸음 수</span><input name="steps" type="number" value="${r.steps}"></label>
      <label><span>수면 (h)</span><input name="sleep_hours" type="number" step="0.1" value="${r.sleep_hours}"></label>
      <label class="ef-full"><span>메모</span><input name="memo" value="${esc(r.memo)}"></label>
      <button class="primary ef-full" type="submit">저장</button>
    </form>`;
  $("editForm").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const body = {
      date:r.date, weight:parseFloat(f.get("weight")), height:parseFloat(f.get("height")),
      systolic:parseInt(f.get("systolic")), diastolic:parseInt(f.get("diastolic")),
      blood_sugar:parseInt(f.get("blood_sugar")), steps:parseInt(f.get("steps"))||0,
      sleep_hours:parseFloat(f.get("sleep_hours"))||0, memo:f.get("memo")||"",
    };
    const res = await fetch("/records/" + r.id, {method:"PUT",
      headers:{"Content-Type":"application/json", ...authHead()}, body:JSON.stringify(body)});
    if (res.status === 401){ showAuth(); return; }
    closeUiModal(); loadAll();
  };
  $("uiModal").classList.remove("hidden");
}

async function saveMemo(r){
  const body = {
    date:r.date, weight:r.weight, height:r.height, systolic:r.systolic,
    diastolic:r.diastolic, blood_sugar:r.blood_sugar,
    steps:r.steps, sleep_hours:r.sleep_hours, memo:$("memoInput").value,
  };
  const btn = $("memoSave"); btn.textContent = "저장중…"; btn.disabled = true;
  const res = await fetch("/records/" + r.id, {method:"PUT",
    headers:{"Content-Type":"application/json", ...authHead()}, body:JSON.stringify(body)});
  if (res.status === 401){ showAuth(); return; }
  loadAll();   // 갱신 (선택 유지됨)
}

async function delRecord(id){
  if (!confirm("이 기록을 삭제할까요?")) return;
  const res = await fetch("/records/" + id, {method:"DELETE", headers:authHead()});
  if (res.status === 401){ showAuth(); return; }
  selectedId = null;
  loadAll();
}

$("recForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  const body = {
    date:f.get("date"),
    weight:parseFloat(f.get("weight")),
    height:parseFloat(f.get("height")),
    systolic:parseInt(f.get("systolic")),
    diastolic:parseInt(f.get("diastolic")),
    blood_sugar:parseInt(f.get("blood_sugar")),
    steps: parseInt(f.get("steps")) || 0,
    sleep_hours: parseFloat(f.get("sleep_hours")) || 0,
    memo: f.get("memo") || "",
  };
  const res = await fetch("/records", {
    method:"POST",
    headers:{"Content-Type":"application/json", ...authHead()},
    body: JSON.stringify(body)
  });
  if (res.status === 401){ showAuth(); return; }
  e.target.reset();
  loadAll();
});

// ----- 그래프 / 히스토리 모달 -----
function lineChart(series, color, bands){
  const clean = series.filter(s => s.value != null);
  if (!clean.length) return `<div class="detail-empty">데이터 없음</div>`;
  const W=620,H=210,pl=44,pr=48,pt=16,pb=28,n=clean.length;
  const vals=clean.map(s=>s.value);
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if (bands) bands.forEach(b=>{ mn=Math.min(mn,b.y); mx=Math.max(mx,b.y); });
  if (mn===mx){ mn-=1; mx+=1; }
  const gap=(mx-mn)*0.08; mn-=gap; mx+=gap;
  const iw=W-pl-pr, ih=H-pt-pb;
  const X=i=> pl + (n===1? iw/2 : iw*i/(n-1));
  const Y=v=> pt + ih*(1-(v-mn)/(mx-mn));
  const pts=clean.map((s,i)=>`${X(i).toFixed(1)},${Y(s.value).toFixed(1)}`).join(" ");
  const area=`${pl},${(pt+ih).toFixed(1)} ${pts} ${X(n-1).toFixed(1)},${(pt+ih).toFixed(1)}`;
  let bandSvg="";
  if (bands) bands.forEach(b=>{ const yy=Y(b.y);
    bandSvg+=`<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W-pr}" y2="${yy.toFixed(1)}" stroke="${b.color}" stroke-width="1" stroke-dasharray="4 3" opacity=".6"/>`+
      `<text x="${W-pr+3}" y="${(yy+3).toFixed(1)}" font-size="9" fill="${b.color}">${b.label}</text>`; });
  const step=Math.max(1, Math.ceil(n/8));
  const dots = n<=45 ? clean.map((s,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(s.value).toFixed(1)}" r="2.5" fill="${color}"/>`).join("") : "";
  const xlab = clean.map((s,i)=> (i%step===0||i===n-1) ? `<text x="${X(i).toFixed(1)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${s.label}</text>` : "").join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block">
    ${bandSvg}<polygon points="${area}" fill="${color}" opacity="0.08"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>${dots}${xlab}</svg>`;
}

function monthRows(records, cells){
  const asc = records.slice().sort((a,b)=> a.date < b.date ? 1 : -1);  // 최신 먼저
  let html="", cur="";
  for (const r of asc){ const m=r.date.slice(0,7);
    if (m!==cur){ cur=m; html+=`<tr class="month-sep"><td colspan="9">${m}</td></tr>`; }
    html+=`<tr>${cells(r)}</tr>`; }
  return html;
}

const TREND_CONF = {
  weight:{title:"체중 추이 (kg)", val:r=>r.weight, bands:null},
  bmi:{title:"BMI 추이", val:r=>r.bmi, bands:[{y:18.5,label:"저체중",color:"#3b82f6"},{y:23,label:"정상↑",color:"var(--warn-dot)"},{y:25,label:"비만",color:"var(--bad-dot)"}]},
  bp:{title:"수축기 혈압 추이", val:r=>r.systolic, bands:[{y:120,label:"주의",color:"var(--warn-dot)"},{y:140,label:"고혈압",color:"var(--bad-dot)"}]},
  sugar:{title:"공복 혈당 추이 (mg/dL)", val:r=>r.blood_sugar, bands:[{y:100,label:"공복혈당장애",color:"var(--warn-dot)"},{y:126,label:"당뇨 의심",color:"var(--bad-dot)"}]},
};
function openTrend(metric){
  const c = TREND_CONF[metric] || TREND_CONF.weight;
  const asc = recordsCache.slice().sort((a,b)=> a.date < b.date ? -1 : 1);
  const pts = asc.map(r => ({label:r.date.slice(5), value:c.val(r)}));
  $("modalBody").innerHTML = `<h3 class="modal-title">${c.title}</h3>${lineChart(pts, "var(--brand)", c.bands)}
    <p class="detail-empty" style="text-align:left;padding:8px 0 0">${asc.length}개 · ${asc[0]?.date} ~ ${asc[asc.length-1]?.date}</p>`;
  $("uiModal").classList.remove("hidden");
}

function openHistory(){
  $("modalBody").innerHTML = `<h3 class="modal-title">전체 기록 (${recordsCache.length}건)</h3>
    <div class="hist-toolbar"><input class="dp-in" id="hStart" placeholder="시작일" readonly>
      <input class="dp-in" id="hEnd" placeholder="종료일" readonly><button class="btn-mini" id="hReset">전체</button></div>
    <div id="histTable"></div>`;
  const chip = (c) => `<span class="chip ${statusClass(c)}">${c}</span>`;
  function render(){
    const s=$("hStart").value, e=$("hEnd").value;
    let list = recordsCache;
    if (s) list = list.filter(r=>r.date>=s);
    if (e) list = list.filter(r=>r.date<=e);
    const body = monthRows(list, (r)=>
      `<td class="num">${r.date}</td><td class="num">${r.weight}</td><td class="num">${r.bmi}</td>`+
      `<td>${chip(r.bmi_category)}</td><td class="num">${r.systolic}/${r.diastolic}</td><td class="num">${r.blood_sugar}</td>`+
      `<td>${r.memo||"—"}</td>`) || `<tr><td colspan="7" class="detail-empty">해당 기간 기록 없음</td></tr>`;
    $("histTable").innerHTML = `<p class="detail-empty" style="text-align:left">${list.length}건</p>
      <div class="tbl-scroll"><table class="hist">
      <thead><tr><th>날짜</th><th>체중</th><th>BMI</th><th>체형</th><th>혈압</th><th>혈당</th><th>메모</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
  }
  attachDatePicker($("hStart")); attachDatePicker($("hEnd"));
  $("hStart").addEventListener("change", render); $("hEnd").addEventListener("change", render);
  $("hReset").onclick = () => { $("hStart").value=""; $("hEnd").value=""; render(); };
  render();
  $("uiModal").classList.remove("hidden");
}

function renderAdvice(){
  const box = $("advice");
  if (!box) return;
  if (!recordsCache.length){ box.innerHTML = `<p class="muted-dash">기록을 추가하면 맞춤 조언을 드려요.</p>`; return; }
  const r = recordsCache[0];
  const tips = [];
  if (r.bmi_category==="비만") tips.push({t:"체중 관리", d:"유산소 운동(주 150분)과 칼로리 조절을 권장해요.", f:"채소·단백질 위주, 정제탄수·튀김 줄이기"});
  else if (r.bmi_category==="과체중") tips.push({t:"체중 주의", d:"가벼운 유산소와 식사량 조절로 정상 범위를 목표로 해요.", f:"저칼로리 간식, 야식 줄이기"});
  else if (r.bmi_category==="저체중") tips.push({t:"영양 보충", d:"규칙적 식사와 단백질 섭취로 체중을 늘려요.", f:"견과류·계란·유제품 등 영양 밀도 높은 식품"});
  if (r.bp_category==="고혈압") tips.push({t:"혈압 관리", d:"나트륨과 음주를 줄이고 스트레스를 관리하세요.", f:"저염식, 국물·가공식품 줄이기, 칼륨 많은 채소·과일"});
  else if (r.bp_category==="주의") tips.push({t:"혈압 주의", d:"짠 음식·카페인을 줄이고 꾸준히 측정하세요.", f:"싱겁게 먹기"});
  if (r.sugar_category==="당뇨 의심") tips.push({t:"혈당 관리", d:"단순당·정제탄수화물을 줄이고 식후 가벼운 운동을 하세요.", f:"저GI 식품(현미·통곡물·콩), 단 음료 피하기"});
  else if (r.sugar_category==="공복혈당장애") tips.push({t:"혈당 주의", d:"당 섭취를 줄이고 규칙적으로 식사하세요.", f:"흰쌀·설탕 줄이기, 식이섬유 늘리기"});
  if ((r.steps||0) < 5000) tips.push({t:"활동량 부족", d:"하루 7천~1만 걸음을 목표로 활동을 늘려보세요.", f:""});
  if (r.sleep_hours>0 && r.sleep_hours<6) tips.push({t:"수면 부족", d:"하루 7~8시간 수면을 권장해요.", f:""});
  if (!tips.length) tips.push({t:"좋은 상태", d:"현재 수치가 모두 양호해요. 지금 습관을 유지하세요! 👍", f:""});
  box.innerHTML = tips.map(x=>`<div class="tip"><div class="tip-t">${x.t}</div><div class="tip-d">${x.d}</div>${x.f?`<div class="tip-f">🍽 ${x.f}</div>`:""}</div>`).join("");
}

function closeUiModal(){ $("uiModal").classList.add("hidden"); }

// ----- 커스텀 달력 (yyyy-mm-dd 표시 + 클릭 선택) -----
function attachDatePicker(input){
  if (!input || input.dataset.dp) return; input.dataset.dp = "1";
  input.readOnly = true; input.autocomplete = "off";
  let pop = null, view = null;
  const pad = (x) => String(x).padStart(2, "0");
  const fmt = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
  function close(){ if (pop){ pop.remove(); pop=null; document.removeEventListener("mousedown", outside, true); window.removeEventListener("scroll", close, true);} }
  function outside(e){ if (pop && !pop.contains(e.target) && e.target !== input) close(); }
  function render(){
    const y=view.getFullYear(), m=view.getMonth();
    const startDow=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), sel=input.value;
    let cells=""; for (let i=0;i<startDow;i++) cells+="<span></span>";
    for (let d=1;d<=days;d++){ const ds=fmt(y,m,d); cells+=`<button type="button" class="dp-day${ds===sel?" sel":""}" data-d="${ds}">${d}</button>`; }
    pop.innerHTML=`<div class="dp-head"><button type="button" class="dp-nav" data-n="-1">‹</button><b>${y}. ${pad(m+1)}</b><button type="button" class="dp-nav" data-n="1">›</button></div>
      <div class="dp-dows"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div class="dp-grid">${cells}</div>`;
    pop.querySelectorAll(".dp-nav").forEach(b=>b.onclick=()=>{ view=new Date(y,m+Number(b.dataset.n),1); render(); });
    pop.querySelectorAll(".dp-day").forEach(b=>b.onclick=()=>{ input.value=b.dataset.d; input.dispatchEvent(new Event("change",{bubbles:true})); close(); });
  }
  function open(){
    if (pop) return;
    view = input.value ? new Date(input.value+"T00:00") : new Date();
    pop=document.createElement("div"); pop.className="dp-pop"; document.body.appendChild(pop);
    const r=input.getBoundingClientRect();
    pop.style.left=Math.max(8, Math.min(r.left, window.innerWidth-252))+"px";
    pop.style.top=(r.bottom+4)+"px";
    render();
    setTimeout(()=>{ document.addEventListener("mousedown", outside, true); window.addEventListener("scroll", close, true); }, 0);
  }
  input.addEventListener("click", open);
  input.addEventListener("focus", open);
}

// 새 기록 날짜: 커스텀 달력 + 오늘 기본값
